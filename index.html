<title>Treinos</title>
<style>
:root{
  --bg:#0A0A0C; --s1:#141417; --s2:#1E1E23; --s3:#2A2A31;
  --tx:#FFFFFF; --tx2:#9C9CA6; --tx3:#61616C;
  --br:#232329; --br2:#34343D;
  --ac:#FF2D46; --ac-d:#3B0F16; --ac-t:#FF7182;
  /* mesmo vermelho, um tom mais fundo: so onde tem letra branca em cima.
     o #FF2D46 da 3.7:1 com branco, abaixo do minimo de leitura; este da 5:1 */
  --ac-f:#D91E36;
  --ok:#FF2D46; --ok-d:#3B0F16;
  --bl:#FFFFFF; --bl-d:#26262C;
  --lm:#FFFFFF; --lm-d:#26262C;
  --rd:#FF2D46;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{height:-webkit-fill-available}
body{
  min-height:100vh;min-height:100dvh;
  background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.5;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
#app{max-width:520px;margin:0 auto;padding:0 16px;min-height:calc(100dvh - 30px)}
header{padding:calc(14px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:21px;font-weight:600;margin:0;letter-spacing:-.02em}
h2{font-size:13px;font-weight:600;color:var(--tx2);margin:22px 0 8px;text-transform:uppercase;letter-spacing:.07em}
.sub{font-size:13px;color:var(--tx3);margin:2px 0 0}
.card{background:var(--s1);border:1px solid var(--br);border-radius:var(--r);padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--s1);border-radius:var(--r);padding:12px 14px}
.stat .k{font-size:12px;color:var(--tx2)}
.stat .v{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.stat.a .v{color:var(--ac-t)}.stat.l .v{color:var(--lm)}
.stat .u{font-size:12px;color:var(--tx3)}
button,.btn{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.b1{display:block;width:100%;background:var(--ac-f);color:#fff;font-weight:600;padding:16px;border-radius:var(--r);font-size:16px;text-align:center;letter-spacing:-.01em}
.b1:active{opacity:.8}
.b2{display:block;width:100%;background:var(--s2);border:1px solid var(--br2);color:var(--tx);padding:13px;border-radius:var(--r);text-align:center;font-size:15px}
.b3{background:var(--s2);border:1px solid var(--br2);padding:8px 13px;border-radius:20px;font-size:13px;color:var(--tx2)}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--br)}
.row:last-child{border-bottom:0}
.ic{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.ic.m{background:var(--ac-d);color:var(--ac-t)}.ic.j{background:var(--bl-d)}.ic.c{background:var(--lm-d)}
.f1{flex:1;min-width:0}
.t{font-size:15px}
.t2{font-size:12px;color:var(--tx3)}
input,select,textarea{
  width:100%;max-width:100%;min-width:0;box-sizing:border-box;
  font:inherit;background:var(--s2);color:var(--tx);
  border:1px solid var(--br2);border-radius:10px;padding:12px;outline:none;
  -webkit-appearance:none;appearance:none;
}
/* iOS dá largura própria aos campos de data e hora, ignorando o width */
input[type="date"],input[type="time"],input[type="tel"],input[type="number"]{display:block}
input[type="date"]::-webkit-date-and-time-value{text-align:left;width:100%;margin:0}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.45;margin:0}
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
select{background-image:none;padding-right:12px}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
label{display:block;font-size:12px;color:var(--tx2);margin:14px 0 6px}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(10,10,12,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--br);display:flex;
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));
}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--tx3);padding:4px 0}
nav button .g{line-height:0;display:flex;align-items:center;justify-content:center;height:22px}
nav button.on{color:var(--ac)}
.pill{display:inline-block;font-size:12px;padding:4px 10px;border-radius:14px;background:var(--s2);color:var(--tx2);margin:0 6px 6px 0}
.flash{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));z-index:95;
  transform:translateX(-50%) translateY(12px);background:var(--s3);border:1px solid var(--br2);
  color:var(--tx);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;
  letter-spacing:-.01em;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
  box-shadow:0 10px 30px rgba(0,0,0,.55)}
.flash.on{opacity:1;transform:translateX(-50%) translateY(0)}
.segp{display:inline-flex;background:var(--s2);border-radius:999px;padding:3px;gap:2px}
.segp button{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--tx3);padding:5px 12px;border-radius:999px;transition:background .18s,color .18s}
.segp button.on{background:var(--ac-f);color:#fff}
.ldia{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tx3);padding:14px 0 7px;border-bottom:1px solid var(--br)}
.ldia:first-child{padding-top:12px}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--br)}
.lrow:last-child{border-bottom:0}
.lic{width:28px;height:28px;flex:0 0 28px;border-radius:9px;display:flex;
  align-items:center;justify-content:center;background:var(--s2);color:var(--tx2)}
.lic.m{background:var(--ac-d);color:var(--ac-t)}
.lic.j{background:var(--bl-d)}
.lic.c{background:var(--lm-d)}
.lnome{flex:1;min-width:0;font-size:14px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnome.meu{color:var(--ac-t)}
.lmod{flex:0 0 auto;font-size:12px;color:var(--tx3)}

/* feed: quem treinou, com a reacao */
.fdl{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--br)}
.fdl:last-child{border-bottom:0}
.fav{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--s3);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--tx)}
.fav.meu{background:var(--ac-f);color:#fff}
.fdc{flex:1;min-width:0}
.fdn{font-size:14px;font-weight:600;color:var(--tx);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fdn.meu{color:var(--ac-t)}
.fdm{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);margin-top:2px}
.fbt{flex:0 0 auto;display:flex;align-items:center;gap:5px;background:transparent;
  border:1px solid var(--br2);border-radius:999px;color:var(--tx2);font-size:12px;
  font-weight:700;padding:8px 11px;min-height:38px;
  transition:background .15s,color .15s,border-color .15s,transform .12s}
.fbt.on{background:var(--ac-d);border-color:var(--ac-d);color:var(--ac-t)}
.fbt:active{transform:scale(.9)}
.fbt.meu{border-color:transparent;background:var(--ac-d);color:var(--ac-t)}

/* meta da semana: comparada so com voce mesmo */
.mt{background:var(--s1);border:1px solid var(--br);border-radius:var(--r);padding:14px;margin-bottom:20px}
.mt.zero{border-color:var(--br2);padding:16px}
.mtb{display:flex;height:8px;border-radius:999px;background:var(--s3);overflow:hidden}
.mtb>i{display:block;background:var(--ac);border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.mz{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.mzi{width:40px;height:40px;flex:0 0 40px;border-radius:13px;background:var(--ac-d);
  color:var(--ac-t);display:flex;align-items:center;justify-content:center}
.porta{margin:0;padding:4px 6px 0;font-size:12px;line-height:1.5;color:var(--tx2);text-align:center}
.rkgap{display:flex;align-items:center;justify-content:center;padding:7px 0;
  font-size:12px;color:var(--tx2);border-bottom:1px solid var(--br)}
.pill.on{background:var(--ac-d);color:var(--ac-t)}
.pill.b{background:var(--bl-d);color:#A8B8FF}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 10px;border-radius:16px;background:var(--s2);color:var(--tx);margin:0 6px 6px 0}
.tag b{color:var(--tx3);font-weight:400}
.bar{height:6px;background:var(--s2);border-radius:4px;overflow:hidden;margin:8px 0 6px}
.bar>i{display:block;height:100%;background:var(--ac);border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.5)}62%{transform:scale(1.09)}100%{opacity:1;transform:scale(1)}}
@keyframes slideL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.82)}}
@keyframes glow{0%,100%{box-shadow:0 12px 34px -14px rgba(255,45,70,.75)}50%{box-shadow:0 12px 44px -12px rgba(255,45,70,1)}}
.an{animation:rise .42s cubic-bezier(.2,.85,.3,1) both}
.ap{animation:pop .34s cubic-bezier(.2,1.3,.45,1) both}
.al{animation:slideL .38s cubic-bezier(.2,.85,.3,1) both}
button,.cta,.b1,.b2,.b3,.row,.card{transition:transform .12s ease,opacity .12s ease}
button:active,.cta:active,.row:active{transform:scale(.975)}
.live{animation:pulse 1.4s ease-in-out infinite}
.wm{font-size:10px;font-weight:800;letter-spacing:.28em;color:var(--ac);text-transform:uppercase}
.gg{font-size:clamp(78px,27vw,116px);font-weight:800;letter-spacing:-.065em;line-height:.82;color:var(--ac);font-variant-numeric:tabular-nums}
.lb{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
.mes{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--br);border-radius:16px;overflow:hidden;margin-bottom:12px}
.mes>div{background:var(--s1);padding:14px 10px;text-align:center}
.mes .v{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.mes .v.z{color:var(--tx3)}
.mes .l{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin-top:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{position:relative;overflow:hidden;background:var(--s1);border:1px solid var(--br);border-radius:20px;padding:16px 14px;text-align:left;min-height:118px;display:flex;flex-direction:column;justify-content:space-between}
.tile .e{position:absolute;right:13px;top:13px;opacity:.2;line-height:0;color:var(--tx)}
.tile .e svg{display:block}
.tile .n{font-size:17px;font-weight:800;letter-spacing:-.02em}
.tile .v{font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--ac);font-variant-numeric:tabular-nums}
.tile .u{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin-top:4px}
.tile.full{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;justify-content:space-between}
.obj{background:var(--ac-d);border:1px solid var(--ac);border-radius:20px;padding:18px 16px;margin-bottom:12px;position:relative;overflow:hidden}
.obj .d{font-size:52px;font-weight:800;letter-spacing:-.05em;line-height:.9;color:var(--ac-t);font-variant-numeric:tabular-nums}

/* ---- landing, login e primeiro acesso ---- */
body.limpo{padding-bottom:0}
.lp{max-width:560px;margin:0 auto;padding:0 20px}
.lp-top{display:flex;align-items:center;justify-content:space-between;padding:calc(20px + env(safe-area-inset-top)) 0 0}
.lp h1{font-size:clamp(44px,13vw,62px);font-weight:800;letter-spacing:-.05em;line-height:.92;margin:36px 0 0}
.lp h1 em{font-style:normal;color:var(--ac)}
.lp .lead{font-size:17px;color:var(--tx2);line-height:1.55;margin:18px 0 0;max-width:30em}
.lp h3{font-size:clamp(26px,7vw,32px);font-weight:800;letter-spacing:-.035em;line-height:1.08;margin:0 0 22px}
.sec{padding:44px 0;border-top:1px solid var(--br)}
.pt{display:flex;gap:14px;padding:16px 0}
.pt .k{flex:0 0 38px;height:38px;border-radius:11px;background:var(--ac-d);color:var(--ac-t);display:flex;align-items:center;justify-content:center}
.pt .tt{font-size:16px;font-weight:700;letter-spacing:-.01em;margin-bottom:3px}
.pt .dd{font-size:14px;color:var(--tx2);line-height:1.5}
.passo{display:flex;gap:14px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--br)}
.passo:last-child{border-bottom:0}
.passo .n{font-size:30px;font-weight:800;color:var(--ac);letter-spacing:-.04em;flex:0 0 34px;line-height:1}
.demo{background:var(--s1);border:1px solid var(--br);border-radius:22px;padding:20px 18px;margin-top:32px}
.rod{padding:34px 0 calc(34px + env(safe-area-inset-bottom));border-top:1px solid var(--br);color:var(--tx3);font-size:12px;text-align:center}
.ob-sel{display:block;width:100%;text-align:left;background:var(--s1);border:1.5px solid var(--br);border-radius:16px;padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
.ob-sel.on{border-color:var(--ac);background:var(--ac-d)}
.ob-sel .ii{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.ob-sel.on .ii{background:var(--ac);color:#fff}
.ob-sel .nn{font-size:16px;font-weight:700}
.ob-sel .dd{font-size:13px;color:var(--tx3)}
.prog{display:flex;gap:6px;margin:20px 0 26px}
.prog i{flex:1;height:3px;border-radius:2px;background:var(--s2)}
.prog i.on{background:var(--ac)}

.rv{opacity:0;transform:translateY(26px);transition:opacity .65s cubic-bezier(.2,.85,.3,1),transform .65s cubic-bezier(.2,.85,.3,1)}
.rv.on{opacity:1;transform:none}
.rot{display:inline-block;transition:opacity .3s,transform .3s}
.rot.sai{opacity:0;transform:translateY(-14px)}
.fix{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(10,10,12,.94);backdrop-filter:blur(16px);border-top:1px solid var(--br);
  transform:translateY(130%);transition:transform .4s cubic-bezier(.2,.85,.3,1)}
.fix.on{transform:none}
.fix .lp{padding:0}
.faq{border-top:1px solid var(--br)}
.faq details{padding:17px 0;border-bottom:1px solid var(--br)}
.faq summary{cursor:pointer;font-size:16px;font-weight:700;letter-spacing:-.01em;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:14px}
.faq summary::-webkit-details-marker{display:none}
.faq summary .mm{color:var(--ac);font-size:22px;font-weight:400;line-height:1;transition:transform .25s}
.faq details[open] summary .mm{transform:rotate(45deg)}
.faq p{color:var(--tx2);font-size:14.5px;line-height:1.6;margin:12px 0 0}
.dm{background:var(--s1);border:1px solid var(--br);border-radius:22px;padding:18px;margin-top:30px}
.dm .lin{font-size:12px;color:var(--tx3);margin-bottom:12px}
.dm .cx{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:7px;align-items:center}
.dm .cp{background:var(--s2);border:1.5px solid var(--br2);border-radius:10px;padding:11px 4px;text-align:center;font-weight:600;transition:all .3s}
.dm .cp.novo{border-color:var(--ac);color:var(--ac-t)}
.dm .ck{height:42px;border-radius:10px;background:var(--s2);border:1.5px solid var(--br2);display:flex;align-items:center;justify-content:center;color:var(--tx3);transition:all .3s}
.dm .ck.on{background:var(--ac);border-color:var(--ac);color:#fff}
.dm .desc{margin-top:12px;background:var(--ac-d);border-radius:12px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;opacity:0;transform:translateY(-6px);transition:all .35s}
.dm .desc.on{opacity:1;transform:none}

.dm .jt{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.dm .jf{font-size:15px;font-weight:700;letter-spacing:-.01em}
.dm .jn{font-size:26px;font-weight:800;letter-spacing:-.04em;color:var(--ac);font-variant-numeric:tabular-nums;line-height:1}
.dm .jbar{height:6px;background:var(--s2);border-radius:4px;overflow:hidden;margin-bottom:8px}
.dm .jbar>i{display:block;height:100%;width:0;background:var(--ac);border-radius:4px;transition:width .9s cubic-bezier(.2,.85,.3,1)}
.dm .jb{margin-top:14px;background:var(--ac);color:#fff;border-radius:13px;padding:14px;text-align:center;
  font-size:16px;font-weight:700;transition:all .3s cubic-bezier(.2,.85,.3,1)}
.dm .jb.viva{background:var(--ac-d);color:var(--ac-t)}
.dm .jb.toque{transform:scale(.95)}
.jtags{margin-top:12px;min-height:30px}
.jtags span{display:inline-block;font-size:12px;padding:5px 11px;border-radius:14px;background:var(--s2);color:var(--tx2);
  margin:0 6px 6px 0;opacity:0;transform:scale(.75);transition:all .32s cubic-bezier(.2,1.3,.45,1)}
.jtags span.on{opacity:1;transform:none}
.conq{display:flex;align-items:center;gap:12px;margin-top:14px;background:var(--ac-d);border:1px solid var(--ac);
  border-radius:14px;padding:12px 14px;opacity:0;transform:translateY(10px) scale(.96);
  transition:all .45s cubic-bezier(.2,1.2,.4,1)}
.conq.on{opacity:1;transform:none}
.conq .cq-ic{width:36px;height:36px;flex:0 0 36px;border-radius:11px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center}
.conq .cq-t{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ac-t)}
.conq .cq-d{font-size:15px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.dm .desc .v{font-size:23px;font-weight:700;color:var(--ac-t);font-variant-numeric:tabular-nums}

.toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;z-index:80;max-width:496px;margin:0 auto;
  background:var(--s2);border:1px solid var(--ac);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;
  transform:translateY(-160%);transition:transform .5s cubic-bezier(.2,.9,.3,1);box-shadow:0 14px 40px -18px rgba(255,45,70,.9)}
.toast.on{transform:none}
.toast .ti{width:36px;height:36px;flex:0 0 36px;border-radius:11px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center}
.toast .tl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ac-t)}
.toast .tn{font-size:15px;font-weight:700;letter-spacing:-.01em;margin-top:1px}
.cq{display:flex;gap:13px;align-items:center;padding:13px;border-radius:16px;background:var(--s1);border:1px solid var(--br);margin-bottom:8px}
.cq.on{border-color:var(--ac)}
.cq.off{opacity:.5}
.cq .ci{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--s2);color:var(--tx3)}
.cq.on .ci{background:var(--ac);color:#fff}
.cq .cn{font-size:15px;font-weight:700;letter-spacing:-.01em}
.cq .cd{font-size:12.5px;color:var(--tx3);line-height:1.45;margin-top:1px}
.cq .cb{height:4px;background:var(--s2);border-radius:3px;overflow:hidden;margin-top:7px}
.cq .cb>i{display:block;height:100%;background:var(--tx3);border-radius:3px}
.cq .cx{font-size:11px;color:var(--tx3);margin-top:5px;font-variant-numeric:tabular-nums}
.cqr{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.cqr .b{flex:0 0 auto;display:flex;align-items:center;gap:9px;background:var(--s1);border:1px solid var(--br);border-radius:14px;padding:10px 13px}
.cqr .b .ii{width:30px;height:30px;border-radius:9px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center}
.cqr .b .nn{font-size:13px;font-weight:700;white-space:nowrap}

.seg{display:flex;gap:6px;background:var(--s1);border:1px solid var(--br);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{flex:1;padding:9px;border-radius:11px;font-size:14px;font-weight:600;color:var(--tx3)}
.seg button.on{background:var(--ac);color:#fff}
.med{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--br);border-radius:16px;overflow:hidden;margin-bottom:14px}
.med>div{background:var(--s1);padding:13px 8px;text-align:center}
.med .v{font-size:25px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.med .l{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin-top:5px}
.med .o{color:#F5C451}.med .p{color:#CFD3DA}.med .b{color:#D08A55}
.cmp{background:var(--s1);border:1px solid var(--br);border-radius:18px;padding:15px;margin-bottom:10px}
.cmp.prox{border-color:var(--ac);background:var(--ac-d)}
.cmp .nm{font-size:17px;font-weight:800;letter-spacing:-.02em}
.cmp .mt{font-size:12.5px;color:var(--tx3);margin-top:2px}
.cmp .cc{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 11px;border-radius:12px;margin-top:11px}
.cc.ouro{background:#3A2E0E;color:#F5C451}
.cc.prata{background:#292C33;color:#CFD3DA}
.cc.bronze{background:#33220F;color:#D08A55}
.cc.participou{background:var(--s2);color:var(--tx2)}
.cc.pend{background:var(--ac);color:#fff}

.inst{background:var(--ac-d);border:1px solid var(--ac);border-radius:20px;padding:16px;margin-bottom:12px}
.inst .tt{font-size:16px;font-weight:800;letter-spacing:-.02em}
.inst .dd{font-size:13.5px;color:var(--ac-t);line-height:1.5;margin-top:3px}
.pss{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--br)}
.pss:last-child{border-bottom:0}
.pss .nn{flex:0 0 30px;height:30px;border-radius:9px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.pss .tx{font-size:14.5px;line-height:1.5}
.pss .tx b{font-weight:700}
.pss .ii{display:inline-flex;vertical-align:-5px;margin:0 3px;color:var(--ac-t)}

.prox-c{background:var(--s1);border:1px solid var(--ac);border-radius:20px;padding:16px;margin-bottom:16px}
.prox-c .lbl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ac-t)}
.prox-c .nm{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:5px 0 3px}
.prox-c .ds{font-size:13px;color:var(--tx3);line-height:1.45}
.prox-c .bb{height:7px;background:var(--s2);border-radius:4px;overflow:hidden;margin:13px 0 7px}
.prox-c .bb>i{display:block;height:100%;background:var(--ac);border-radius:4px;transition:width .8s cubic-bezier(.2,.85,.3,1)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:6px}
.md{background:var(--s1);border:1px solid var(--br);border-radius:16px;padding:13px 8px;text-align:center}
.md .aro{width:50px;height:50px;margin:0 auto 9px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--s2);color:var(--tx3);border:2px solid var(--br2)}
.md.ok.ouro .aro{background:#3A2E0E;border-color:#F5C451;color:#F5C451}
.md.ok.prata .aro{background:#292C33;border-color:#CFD3DA;color:#CFD3DA}
.md.ok.bronze .aro{background:#33220F;border-color:#D08A55;color:#D08A55}
.md .tt{font-size:11px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.md.lk{opacity:.42}
.md .pc{font-size:10px;color:var(--tx3);margin-top:4px;font-variant-numeric:tabular-nums}
.rsm{text-align:center;padding:12px 0 0}
.rsm .kk{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ac-t)}
.rsm .h2{font-size:clamp(34px,10vw,46px);font-weight:800;letter-spacing:-.04em;line-height:1.02;margin:8px 0 6px}
.rsm .st{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--br);border-radius:18px;overflow:hidden;margin:22px 0}
.rsm .st>div{background:var(--s1);padding:16px 8px}
.rsm .st .v{font-size:25px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.rsm .st .l{font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--tx3);margin-top:5px}
.rec{display:flex;align-items:center;gap:12px;background:var(--ac-d);border:1px solid var(--ac);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.rec .rt{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ac-t)}
.rec .rn{font-size:15px;font-weight:700;letter-spacing:-.01em;margin-top:2px}

/* ---- analises ---- */

<script>
/* ---------- armazenamento: funciona no claude.ai e como arquivo local ---------- */
var KEY_LEGADO='treinos:db';
function uidLocal(){try{return localStorage.getItem('treinos:uid')||''}catch(e){return ''}}
function chaveDb(){
  if(SB&&SB.user)return 'treinos:db:'+SB.user.id;
  var u=uidLocal();
  return u?'treinos:db:'+u:KEY_LEGADO;
}
var store={
  async get(k){
    k=k||chaveDb();
    try{ if(window.storage&&window.storage.get){var r=await window.storage.get(k);return r&&r.value?JSON.parse(r.value):null;} }catch(e){}
    try{ var v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; }
  },
  async set(o,k){
    k=k||chaveDb();
    var s=JSON.stringify(o);
    try{ if(window.storage&&window.storage.set){ await window.storage.set(k,s); return; } }catch(e){}
    try{ localStorage.setItem(k,s); }catch(e){}
  }
};

var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
/* Data no fuso de quem esta usando. toISOString() devolve UTC: em Porto
   Ferreira (UTC-3) o app virava o dia as 21h, e o treino da noite caia
   no dia seguinte. Tudo que e DIA passa por aqui; so instante usa UTC. */
function dISO(d){
  d=d||new Date();
  var m=d.getMonth()+1,x=d.getDate();
  return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x;
}
var hoje=function(){return dISO()};

/* ---------- semente ---------- */
function semente(){
  var ex=[
    ['Supino reto','Peito','Barra'],['Supino inclinado halter','Peito','Halter'],

    ['Tríceps testa','Tríceps','Barra'],['Desenvolvimento halter','Ombro','Halter'],
    ['Puxada frente','Costas','Polia'],['Remada curvada','Costas','Barra'],
    ['Remada unilateral','Costas','Halter'],['Rosca direta','Bíceps','Barra'],
    ['Rosca martelo','Bíceps','Halter'],['Agachamento livre','Perna','Barra'],
    ['Leg press','Perna','Máquina'],['Cadeira extensora','Perna','Máquina'],
    ['Mesa flexora','Perna','Máquina'],['Panturrilha em pé','Perna','Máquina'],
    ['Elevação lateral','Ombro','Halter'],['Prancha','Core','Livre']
  ].map(function(e){return {id:uid(),nome:e[0],grupo:e[1],equip:e[2],ativo:true}});
  var f=function(n){return ex.find(function(e){return e.nome===n}).id};
  var tr=[
    {id:uid(),nome:'Treino A',foco:'Peito e tríceps',ordem:1,ativo:true,itens:[
      {ex:f('Supino reto'),series:4,reps:8},{ex:f('Supino inclinado halter'),series:3,reps:10},
      {ex:f('Crucifixo máquina'),series:3,reps:12},{ex:f('Desenvolvimento halter'),series:3,reps:10},
      {ex:f('Tríceps corda'),series:3,reps:12},{ex:f('Tríceps testa'),series:3,reps:10}]},
    {id:uid(),nome:'Treino B',foco:'Costas e bíceps',ordem:2,ativo:true,itens:[
      {ex:f('Puxada frente'),series:4,reps:10},{ex:f('Remada curvada'),series:4,reps:8},
      {ex:f('Remada unilateral'),series:3,reps:10},{ex:f('Rosca direta'),series:3,reps:10},
      {ex:f('Rosca martelo'),series:3,reps:12},{ex:f('Elevação lateral'),series:3,reps:15}]},
    {id:uid(),nome:'Treino C',foco:'Pernas',ordem:3,ativo:true,itens:[
      {ex:f('Agachamento livre'),series:4,reps:8},{ex:f('Leg press'),series:4,reps:12},
      {ex:f('Cadeira extensora'),series:3,reps:15},{ex:f('Mesa flexora'),series:3,reps:12},
      {ex:f('Panturrilha em pé'),series:4,reps:15},{ex:f('Prancha'),series:3,reps:1}]}
  ];
  return {
    v:1,

function detalhe(s){

    var pc=(s.duracao*60)/s.detalhes.km;p.push(Math.floor(pc/60)+':'+String(Math.round(pc%60)).padStart(2,'0')+'/km');
  }
  return diaSem(s.data)+' '+dtBr(s.data)+(p.length?' · '+p.join(' · '):'');
}

/* ---------- tela ---------- */
function contar(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches){
    document.querySelectorAll('[data-cnt]').forEach(function(e){e.textContent=e.getAttribute('data-cnt')});return;
  }
  document.querySelectorAll('[data-cnt]').forEach(function(el){
    var alvo=+el.getAttribute('data-cnt')||0,dur=760,t0=null;
    if(!alvo){el.textContent='0';return}
    function passo(t){
      if(!t0)t0=t;
      var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
      el.textContent=Math.round(alvo*e);
      if(p<1)requestAnimationFrame(passo);
    }
    requestAnimationFrame(passo);
  });
}

function recordeAnterior(exId,sidAtual){

    .forEach(function(y){
      var ses=db.sessoes.find(function(o){return o.id===y.sessao_id});
      if(!ses||ses.arquivada)return;
      if(+y.carga>mx)mx=+y.carga;

function fechar(){
  var t=document.getElementById('nt');
  if(t&&t.getAttribute('oninput')){
    var m=/notaJiu\('([^']+)'/.exec(t.getAttribute('oninput'));
    if(m){var ss=db.sessoes.find(function(x){return x.id===m[1]});if(ss)pendenteTec(ss)}
    clearTimeout(NT);salvar();
  }
  var e=document.getElementById('sheet');if(e)e.remove();render();
}
var NT=null;
function lerNota(s){var e=document.getElementById('nt');if(e)s.notas=e.value}
function notaJiu(id,v){
  var s=db.sessoes.find(function(x){return x.id===id});
  if(!s)return;
  s.notas=v;

  NT=setTimeout(function(){salvar()},400);
}
async function setTipo(id,t){

async function addTec(id,val){
  var s=db.sessoes.find(function(x){return x.id===id});
  var i=document.getElementById('ti'),v=(val||i.value||'').trim().toLowerCase();
  if(!v)return;
  s.detalhes.tecnicas=s.detalhes.tecnicas||[];
  if(s.detalhes.tecnicas.indexOf(v)<0)s.detalhes.tecnicas.push(v);
  if(db.tecnicas.indexOf(v)<0)db.tecnicas.push(v);
  lerNota(s);
  await salvar();fechar();abrirDetalhe(id);
}
async function remTec(id,v){
  var s=db.sessoes.find(function(x){return x.id===id});
  s.detalhes.tecnicas=s.detalhes.tecnicas.filter(function(t){return t!==v});
  lerNota(s);await salvar();fechar();abrirDetalhe(id);
}
function pendenteTec(s){
  // o que ficou digitado no campo também conta: ninguém deve perder texto por não apertar enter
  var i=document.getElementById('ti');

  s.detalhes.tecnicas=s.detalhes.tecnicas||[];
  if(s.detalhes.tecnicas.indexOf(v)<0)s.detalhes.tecnicas.push(v);
  if(db.tecnicas.indexOf(v)<0)db.tecnicas.push(v);
  i.value='';
}

async function restaurarLocal(){
  var b='';
  try{b=localStorage.getItem('treinos:backup')||''}catch(e){}
  if(!b){alert('Não há cópia guardada neste aparelho.');return}
  var d;
  try{d=JSON.parse(b)}catch(e){alert('A cópia está ilegível.');return}
  var n=(d.sessoes||[]).filter(function(x){return !x.aberta&&!x.arquivada}).length;
  if(!confirm('A cópia guardada tem '+n+' atividades.\n\nIsso vai substituir o que está neste aparelho. Continuar?'))return;
  db=d;migrar();await salvar();ir('home');
  sincronizar(true);
}
function importar(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=async function(){
    var d;
    try{d=JSON.parse(r.result)}catch(e){alert('Arquivo inválido: não é um JSON legível.');inp.value='';return}
    if(!d||!Array.isArray(d.exercicios)||!Array.isArray(d.sessoes)||!Array.isArray(d.series)){
      alert('Arquivo inválido: não parece um backup do Treinos.');inp.value='';return;
    }
    var fe=d.sessoes.filter(function(s){return !s.aberta}).length;
    var fs=d.series.filter(function(x){return x.feita}).length;
    if(!confirm('O backup tem '+fe+' sessões e '+fs+' séries.\n\nIsso vai substituir os dados deste aparelho. Continuar?')){inp.value='';return}
    // rede de segurança: guarda o estado atual antes de trocar
    try{await store.set(db)}catch(e){}
    d.perfil=d.perfil||{nome:'',meta:4,descanso:90,principal:'musculacao'};
    d.treinos=d.treinos||[];d.graduacoes=d.graduacoes&&d.graduacoes.length?d.graduacoes:[{id:uid(),faixa:'Branca',grau:0,data:hoje()}];
    d.tecnicas=d.tecnicas||[];
    db=d;await salvar();ir('home');
    alert('Backup restaurado. '+fe+' sessões carregadas.');
  };
  r.readAsText(f);
}

function diasTreinados(){var d={};sessoesOk().forEach(function(s){d[s.data]=1});return Object.keys(d).sort()}
function maiorSequencia(){
  var ds=diasTreinados(),melhor=0,atual=0,ant=null;
  ds.forEach(function(d){
    if(ant){var dif=(new Date(d)-new Date(ant))/86400000;atual=(dif===1)?atual+1:1}else atual=1;
    if(atual>melhor)melhor=atual;ant=d;
  });
  return melhor;
}
function totalKm(){return sessoesOk().filter(function(s){return s.tipo==='corrida'})
  .reduce(function(a,s){return a+(+(s.detalhes||{}).km||0)},0)}
function maiorCorrida(){return sessoesOk().filter(function(s){return s.tipo==='corrida'})
  .reduce(function(a,s){return Math.max(a,+(s.detalhes||{}).km||0)},0)}
function maiorVolume(){
  var v={};db.series.filter(function(x){return x.feita}).forEach(function(x){
    v[x.sessao_id]=(v[x.sessao_id]||0)+(+x.carga||0)*(+x.reps||0)});
  return Object.keys(v).reduce(function(a,k){return Math.max(a,v[k])},0);
}
function exerciciosComProgresso(){
  var por={},n=0;
  db.series.filter(function(x){return x.feita&&+x.carga>0}).forEach(function(x){
    (por[x.exercicio_id]=por[x.exercicio_id]||[]).push(+x.carga)});
  Object.keys(por).forEach(function(k){
    var l=por[k];if(l.length>3&&Math.max.apply(null,l)>l[l.length-1])n++;
  });
  return n;
}
function semanasSeguidasJiu(){
  var sem={};sessoesOk().filter(function(s){return s.tipo==='jiujitsu'}).forEach(function(s){
    var d=new Date(s.data+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));
    var k=dISO(d);sem[k]=(sem[k]||0)+1;
  });
  var ks=Object.keys(sem).sort(),melhor=0,atual=0,ant=null;
  ks.forEach(function(k){
    if(sem[k]<2){atual=0;ant=k;return}
    if(ant&&(new Date(k)-new Date(ant))/604800000===1)atual++;else atual=1;
    if(atual>melhor)melhor=atual;ant=k;
  });
  return melhor;
}

function iconeConq(id){
  if(id.indexOf('ger')===0)return 'chama';

function comNivel(L){
  // dentro de cada família, o degrau mais alto vale ouro
  var fam={};
  L.forEach(function(c){var f=c.id.slice(0,3);(fam[f]=fam[f]||[]).push(c)});
  Object.keys(fam).forEach(function(f){
    var ls=fam[f].slice().sort(function(a,b){return a.alvo-b.alvo});
    ls.forEach(function(c,i){
      var t=i/Math.max(1,ls.length-1);
      c.nivel=t>=0.75?'ouro':(t>=0.4?'prata':'bronze');
    });
  });
  return L;

function quebrar(ctx,txt,larg){
  var ps=txt.split(' '),linhas=[],l='';
  ps.forEach(function(w){
    var t=l?l+' '+w:w;
    if(ctx.measureText(t).width>larg&&l){linhas.push(l);l=w}else l=t;
  });
  if(l)linhas.push(l);
  return linhas;
}
function desenhaIcone(ctx,nome,cx,cy,tam,cor){
  var d=IC_CANVAS[nome]||IC_CANVAS.conquista;
  ctx.save();
  ctx.translate(cx-tam/2,cy-tam/2);
  ctx.scale(tam/24,tam/24);
  if(SOLIDO[nome]){ctx.fillStyle=cor;ctx.fill(new Path2D(d),'nonzero')}
  else{ctx.strokeStyle=cor;ctx.lineWidth=1.7;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke(new Path2D(d))}
  ctx.restore();
}
function cardStory(op){
  // op: {ic, etiqueta, titulo, sub, stats:[[valor,rotulo],...], rodape}
  var L=1080,A=1920,c=document.createElement('canvas');
  c.width=L;c.height=A;
  var x=c.getContext('2d');
  var F='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';

  x.fillStyle='#0A0A0C';x.fillRect(0,0,L,A);
  // brilho vermelho ao fundo
  var g=x.createRadialGradient(L/2,760,40,L/2,760,720);
  g.addColorStop(0,'rgba(255,45,70,.30)');g.addColorStop(1,'rgba(255,45,70,0)');
  x.fillStyle=g;x.fillRect(0,0,L,A);

  x.textAlign='center';

  x.letterSpacing='10px';

  // aro com o ícone
  x.beginPath();x.arc(L/2,660,150,0,Math.PI*2);
  x.fillStyle='rgba(255,45,70,.14)';x.fill();
  x.lineWidth=5;x.strokeStyle='#FF2D46';x.stroke();

  if(op.etiqueta){
    x.fillStyle='#FF7182';x.font='700 30px '+F;x.letterSpacing='8px';
    x.fillText(op.etiqueta.toUpperCase(),L/2,930);x.letterSpacing='0px';
  }

  x.fillStyle='#FFFFFF';x.font='800 92px '+F;
  var linhas=quebrar(x,op.titulo,880),y=1050;
  linhas.slice(0,3).forEach(function(l){x.fillText(l,L/2,y);y+=104});

  if(op.sub){
    x.fillStyle='#9C9CA6';x.font='400 40px '+F;
    quebrar(x,op.sub,860).slice(0,2).forEach(function(l){y+=58;x.fillText(l,L/2,y)});
  }

  if(op.stats&&op.stats.length){
    var n=op.stats.length,larg=880/n,x0=(L-880)/2,base=1530;
    op.stats.forEach(function(st,i){
      var cx=x0+larg*i+larg/2;
      x.fillStyle='#FFFFFF';x.font='800 68px '+F;
      x.fillText(String(st[0]),cx,base);
      x.fillStyle='#61616C';x.font='700 24px '+F;x.letterSpacing='4px';
      x.fillText(String(st[1]).toUpperCase(),cx,base+46);x.letterSpacing='0px';
      if(i<n-1){x.fillStyle='#232329';x.fillRect(x0+larg*(i+1)-1,base-70,2,120)}
    });
  }

  x.fillStyle='#61616C';x.font='400 30px '+F;
  x.fillText(op.rodape||'',L/2,1800);
  return c;
}
function baixarOuCompartilhar(canvas,nome,texto){
  canvas.toBlob(async function(b){
    if(!b)return;
    var arq=new File([b],nome,{type:'image/png'});
    try{
      if(navigator.canShare&&navigator.canShare({files:[arq]})){
        await navigator.share({files:[arq],text:texto});
        return;
      }
    }catch(e){ if(e&&e.name==='AbortError')return; }
    var a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=nome;a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
  },'image/png');
}

function recordes(sid){
  var s=db.sessoes.find(function(x){return x.id===sid});
  if(!s||s.tipo!=='musculacao')return [];
  var atuais={},out=[];
  db.series.filter(function(x){return x.sessao_id===sid&&x.feita&&+x.carga>0}).forEach(function(x){
    atuais[x.exercicio_id]=Math.max(atuais[x.exercicio_id]||0,+x.carga);
  });
  var antes={};
  var outras=sessoesOk().filter(function(o){return o.tipo==='musculacao'&&o.id!==sid&&o.data<=s.data});
  var ids={};outras.forEach(function(o){ids[o.id]=1});
  db.series.filter(function(x){return ids[x.sessao_id]&&x.feita&&+x.carga>0}).forEach(function(x){
    antes[x.exercicio_id]=Math.max(antes[x.exercicio_id]||0,+x.carga);
  });
  Object.keys(atuais).forEach(function(k){
    if(!antes[k]||atuais[k]>antes[k])out.push({ex:k,carga:atuais[k],anterior:antes[k]||0});
  });
  return out;
}

function primeiraData(){
  var ds=sessoesOk().map(function(s){return s.data}).sort();

function mudaMes(n){
  var p=mesAtual().split('-'),d=new Date(+p[0],+p[1]-1+n,1);
  var novo=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  if(novo>hoje().slice(0,7))return;                 // nao passa do mes corrente
  if(novo<primeiraData().slice(0,7))return;         // nao volta antes do primeiro treino
  ctx.mes=novo;render();
}
function diasDoMes(mes){
  var p=mes.split('-'),ano=+p[0],m=+p[1];
  var pri=new Date(ano,m-1,1), ult=new Date(ano,m,0);
  var vazios=(pri.getDay()+6)%7;                    // segunda = 0
  var out=[],i;
  for(i=0;i<vazios;i++)out.push(null);
  for(i=1;i<=ult.getDate();i++){
    var iso=mes+'-'+String(i).padStart(2,'0');
    out.push({dia:i,iso:iso,tipos:tiposDoDia(iso),hj:iso===hoje()});
  }
  return out;
}

/* ---------- analises ---------- */
function mesesRecentes(n){
  var out=[],d=new Date();d.setDate(1);
  for(var i=n-1;i>=0;i--){
    var x=new Date(d.getFullYear(),d.getMonth()-i,1);
    out.push({iso:x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'),
      rot:['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][x.getMonth()]});
  }
  return out;
}
function porMes(n,tipo){
  return mesesRecentes(n).map(function(m){
    m.n=sessoesOk().filter(function(s){
      return s.data.slice(0,7)===m.iso&&(!tipo||s.tipo===tipo)}).length;
    return m;
  });
}
function contaTipo(t,dias){
  var lim=null;
  if(dias){var d=new Date();d.setDate(d.getDate()-dias);lim=dISO(d)}
  return sessoesOk().filter(function(s){return s.tipo===t&&(!lim||s.data>=lim)}).length;
}
function seriesDe(sid){return db.series.filter(function(x){return x.sessao_id===sid&&x.feita})}

/* --- musculacao --- */
function volumePorGrupo(dias){
  var d=new Date();d.setDate(d.getDate()-(dias||30));
  var lim=dISO(d);
  var ids={};
  sessoesOk().forEach(function(s){if(s.tipo==='musculacao'&&s.data>=lim)ids[s.id]=1});
  var g={};
  db.series.filter(function(x){return ids[x.sessao_id]&&x.feita}).forEach(function(x){
    var gr=ex(x.exercicio_id).grupo||'Outros';
    g[gr]=(g[gr]||0)+(+x.carga||0)*(+x.reps||0);
  });
  return Object.keys(g).map(function(k){return {grupo:k,kg:g[k]}})
    .sort(function(a,b){return b.kg-a.kg});
}
function recordesPorExercicio(){
  var r={};
  db.series.filter(function(x){return x.feita&&+x.carga>0}).forEach(function(x){
    var ses=db.sessoes.find(function(o){return o.id===x.sessao_id});
    if(!ses||ses.arquivada)return;
    var at=r[x.exercicio_id];
    if(!at||+x.carga>at.carga)r[x.exercicio_id]={carga:+x.carga,reps:+x.reps||0,data:ses.data};
  });
  return Object.keys(r).map(function(k){
    return {id:k,nome:ex(k).nome,carga:r[k].carga,reps:r[k].reps,data:r[k].data};
  }).sort(function(a,b){return b.carga-a.carga});
}
function serieDoExercicio(exId){
  // maior carga por sessao, em ordem de data
  var por={};
  db.series.filter(function(x){return x.exercicio_id===exId&&x.feita&&+x.carga>0}).forEach(function(x){
    var ses=db.sessoes.find(function(o){return o.id===x.sessao_id});
    if(!ses||ses.arquivada)return;
    if(!por[ses.data]||+x.carga>por[ses.data])por[ses.data]=+x.carga;
  });
  return Object.keys(por).sort().map(function(d){return {data:d,carga:por[d]}});
}
function exerciciosMaisFeitos(){
  var c={};
  db.series.filter(function(x){return x.feita&&+x.carga>0}).forEach(function(x){
    var ses=db.sessoes.find(function(o){return o.id===x.sessao_id});
    if(!ses||ses.arquivada)return;
    (c[x.exercicio_id]=c[x.exercicio_id]||{});
    c[x.exercicio_id][ses.data]=1;
  });
  return Object.keys(c).map(function(k){return {id:k,nome:ex(k).nome,dias:Object.keys(c[k]).length}})
    .sort(function(a,b){return b.dias-a.dias});
}

/* --- jiu --- */
function tecnicasMaisTreinadas(){
  var c={};
  sessoesOk().forEach(function(s){
    if(s.tipo!=='jiujitsu')return;
    ((s.detalhes||{}).tecnicas||[]).forEach(function(t){c[t]=(c[t]||0)+1});
  });
  return Object.keys(c).map(function(k){return {nome:k,n:c[k]}})
    .sort(function(a,b){return b.n-a.n});
}

/* --- corrida --- */
function corridas(){
  return sessoesOk().filter(function(s){return s.tipo==='corrida'&&+(s.detalhes||{}).km>0})
    .slice().sort(function(a,b){return a.data.localeCompare(b.data)});
}
function ritmoDe(s){
  var km=+(s.detalhes||{}).km||0,mi=s.duracao||0;
  return (km&&mi)?(mi*60)/km:0;
}
function fmtRitmo(seg){
  if(!seg)return '—';
  return Math.floor(seg/60)+':'+String(Math.round(seg%60)).padStart(2,'0');
}

/* --- destaques em frase --- */
function diaSemanaFraco(){
  var nomes=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
  var cont=[0,0,0,0,0,0,0],sem=[0,0,0,0,0,0,0];
  var d=new Date();d.setDate(d.getDate()-70);
  var lim=dISO(d);
  var dias={};
  sessoesOk().forEach(function(s){if(s.data>=lim)dias[s.data]=1});
  for(var i=0;i<70;i++){
    var x=new Date();x.setDate(x.getDate()-i);
    var iso=dISO(x),w=x.getDay();
    sem[w]++;
    if(dias[iso])cont[w]++;
  }
  var pior=null;
  for(var w=0;w<7;w++){
    if(sem[w]<4)continue;
    var taxa=cont[w]/sem[w];
    if(!pior||taxa<pior.taxa)pior={w:w,taxa:taxa,n:cont[w],de:sem[w],nome:nomes[w]};
  }
  return pior;
}
function destaques(){
  var out=[],mods=modalidadesComDado();
  var usados={};
  function add(mod,titulo,sub){
    if(mods.length>1&&usados[mod])return;
    usados[mod]=1;out.push({mod:mod,titulo:titulo,sub:sub});
  }
  // musculacao: maior evolucao percentual
  var melhor=null;
  exerciciosMaisFeitos().slice(0,8).forEach(function(e){
    var sr=serieDoExercicio(e.id);
    if(sr.length<4)return;
    var ini=sr[0].carga,fim=sr[sr.length-1].carga;
    if(fim<=ini)return;
    var pc=Math.round((fim/ini-1)*100);
    if(pc<5)return;
    var sem=Math.max(1,Math.round((new Date(sr[sr.length-1].data)-new Date(sr[0].data))/604800000));
    if(!melhor||pc>melhor.pc)melhor={nome:e.nome,pc:pc,ini:ini,fim:fim,sem:sem};
  });
  if(melhor)add('musculacao','Seu '+melhor.nome.toLowerCase()+' subiu '+melhor.pc+'% em '+
    melhor.sem+(melhor.sem===1?' semana':' semanas'),
    'de '+nk(melhor.ini)+' kg para '+nk(melhor.fim)+' kg');
  // jiu: melhor mes
  var mj=porMes(12,'jiujitsu'),atual=mj[mj.length-1];
  var maxAnt=0;mj.slice(0,-1).forEach(function(m){if(m.n>maxAnt)maxAnt=m.n});
  if(atual.n>0&&atual.n>=maxAnt&&mj.filter(function(m){return m.n>0}).length>1)
    add('jiujitsu',cap(atual.rot)+' já é seu melhor mês no tatame',
      atual.n+(atual.n===1?' aula':' aulas')+' · recorde anterior era '+maxAnt);
  // jiu: constancia recente
  var jiu30=contaTipo('jiujitsu',30);
  if(jiu30>=4)add('jiujitsu',jiu30+' aulas de jiu nos últimos 30 dias',
    'média de '+nk(jiu30/4.3)+' por semana');
  // musculacao: desequilibrio
  var vg=volumePorGrupo(30);
  if(vg.length>=3){
    var top=vg[0],bot=vg[vg.length-1];
    if(top.kg>bot.kg*2.5)
      add('musculacao','Você treinou '+(top.kg/bot.kg).toFixed(1).replace('.',',')+'x mais '+
        top.grupo.toLowerCase()+' que '+bot.grupo.toLowerCase()+' neste mês',
        nk(top.kg/1000)+' t contra '+nk(bot.kg/1000)+' t');
  }
  // geral: dia fraco
  var pior=diaSemanaFraco();
  if(pior&&pior.taxa<0.3&&sessoesOk().length>=10)
    add('geral',cap(pior.nome)+' é seu dia mais fraco',
      pior.n+(pior.n===1?' treino':' treinos')+' nas últimas '+pior.de+' '+pior.nome+'s');
  // geral: sequencia
  var sq=sequencia();
  if(sq>=5)add('geral',sq+' dias seguidos sem falhar','sua melhor marca é '+maiorSequencia()+' dias');
  // corrida
  var cs=corridas();
  if(cs.length>=3){
    var ult=cs[cs.length-1],melhorKm=cs.reduce(function(a,b){
      return (+(b.detalhes||{}).km>+(a.detalhes||{}).km)?b:a});
    if(ult.id===melhorKm.id)add('corrida','Sua última corrida foi a mais longa',
      nk(+(ult.detalhes||{}).km)+' km');
  }
  var ord=['geral'].concat(ordemModalidades());
  out.sort(function(a,b){
    var ia=ord.indexOf(a.mod),ib=ord.indexOf(b.mod);
    // o principal vem antes do geral
    var pa=a.mod===db.perfil.principal?-1:ia, pb=b.mod===db.perfil.principal?-1:ib;
    return pa-pb;
  });
  return out.slice(0,3);
}
function cap(t){return t.charAt(0).toUpperCase()+t.slice(1)}
function nk(v){
  v=+v||0;
  return (Math.round(v*10)/10).toString().replace('.',',');
}
function modalidadesComDado(){
  return ['musculacao','jiujitsu','corrida'].filter(function(t){return contaTipo(t)>=3});
}
function ordemModalidades(){
  var p=db.perfil.principal,m=modalidadesComDado();
  return m.slice().sort(function(a,b){return (a===p?-1:0)-(b===p?-1:0)});
}


/* ---------- graficos ---------- */
function gBarras(dados,rotulo){
  // dados: [{rot, n}]
  var mx=Math.max.apply(null,dados.map(function(d){return d.n}).concat([1]));
  return '<div class="gb">'+dados.map(function(d,i){
      var pc=Math.max(d.n?6:2,Math.round(d.n/mx*100));
      return '<div class="gbc"><div class="gbw">'+
        (d.n?'<span class="gbv" style="bottom:calc('+pc+'% + 3px)">'+d.n+'</span>':'')+
        '<div class="gbb'+(d.n?'':' zero')+'" style="height:'+pc+'%;animation-delay:'+(i*70)+'ms"></div></div>'+
        '<div class="gbl'+(i===dados.length-1?' at':'')+'">'+d.rot+'</div></div>';
    }).join('')+'</div>';
}
function gLinha(pontos,rotIni,rotFim,valFim){
  if(pontos.length<2)return '';
  var L=300,A=104,px=16,py=14;
  var vs=pontos.map(function(p){return p.carga});
  var mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
  if(mx===mn)mx=mn+1;
  var pts=pontos.map(function(p,i){
    var x=px+(L-px*2)*(pontos.length===1?0:i/(pontos.length-1));
    var y=py+(A-py*2-14)*(1-(p.carga-mn)/(mx-mn));
    return {x:Math.round(x*10)/10,y:Math.round(y*10)/10};
  });
  var d=pts.map(function(p){return p.x+','+p.y}).join(' ');
  var fim=pts[pts.length-1],ini=pts[0];
  return '<svg viewBox="0 0 '+L+' '+A+'" class="gl" role="img" aria-label="Evolução da carga de '+
      nk(mn)+' para '+nk(mx)+' quilos">'+
    '<line x1="'+px+'" y1="'+(A-26)+'" x2="'+(L-px)+'" y2="'+(A-26)+'" stroke="var(--br)" stroke-width="1"/>'+
    '<polyline class="glp" points="'+d+'" fill="none" stroke="var(--ac)" stroke-width="2" '+
      'stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+ini.x+'" cy="'+ini.y+'" r="4" fill="var(--ac)" class="glf"/>'+
    '<circle cx="'+fim.x+'" cy="'+fim.y+'" r="5" fill="var(--ac)" stroke="var(--s1)" stroke-width="2" class="glf"/>'+
    '<text x="'+px+'" y="'+(A-8)+'" class="gt">'+esc(rotIni)+'</text>'+
    '<text x="'+(L-px)+'" y="'+(A-8)+'" class="gt" text-anchor="end">'+esc(rotFim)+'</text>'+
    '<text x="'+ini.x+'" y="'+(ini.y-9)+'" class="gt2" text-anchor="middle">'+nk(pontos[0].carga)+'</text>'+
    '<text x="'+(L-px)+'" y="11" class="gt3" text-anchor="end">'+esc(valFim)+'</text>'+
    '</svg>';
}

          nk(g.kg/1000)+' t</span></div>'+

function blocoCorrida(){

/* ---------- social ---------- */
var SOC={perfil:null,grupos:[],membros:{},pessoas:{},presencas:[],feed:[],reacoes:{},
         carregado:false,ocupado:false,erro:''};
function temSocial(){return !!(SB.cli&&SB.user&&SOC.perfil)}
function gerarCodigo(n){
  var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',o='';
  for(var i=0;i<(n||6);i++)o+=a.charAt(Math.floor(Math.random()*a.length));
  return o;
}
function iniciais(nome){
  var p=(nome||'?').trim().split(/\s+/);
  return ((p[0]||'?').charAt(0)+(p[1]?p[1].charAt(0):'')).toUpperCase();
}
function segunda(d){
  var x=new Date((d||hoje())+'T12:00:00');
  x.setDate(x.getDate()-((x.getDay()+6)%7));
  return dISO(x);
}
function primeiroDoMes(d){return (d||hoje()).slice(0,7)+'-01'}
/* no comeco do mes a semana corrente comeca no mes passado:
   busca sempre a data mais antiga das duas, senao o ranking da semana fica furado */
function inicioJanela(){
  var a=segunda(),b=primeiroDoMes();
  return a<b?a:b;
}
function rotuloMes(d){
  var m=['janeiro','fevereiro','março','abril','maio','junho','julho',
         'agosto','setembro','outubro','novembro','dezembro'];
  return m[parseInt((d||hoje()).slice(5,7),10)-1];
}

async function socCarregar(forcar){
  if(!SB.cli||!SB.user)return;
  if(SOC.ocupado)return;
  if(SOC.carregado&&!forcar)return;
  SOC.ocupado=true;SOC.erro='';
  try{
    var u=SB.user.id;
    var meu=await SB.cli.from('tr_social_perfil').select('*').eq('user_id',u).maybeSingle();
    SOC.perfil=meu.data||null;
    if(SOC.perfil){
      var ini=inicioJanela();
      var r=await Promise.all([
        SB.cli.from('tr_grupo_membros').select('grupo_id').eq('user_id',u),
        SB.cli.from('tr_presenca').select('*').gte('data',ini),
        SB.cli.from('tr_social_perfil').select('user_id,apelido'),
        SB.cli.from('tr_presenca_reacoes').select('presenca_id,user_id')
      ]);
      var meusG=(r[0].data||[]).map(function(x){return x.grupo_id});
      SOC.presencas=r[1].data||[];
      SOC.pessoas={};(r[2].data||[]).forEach(function(x){SOC.pessoas[x.user_id]=x.apelido});
      SOC.reacoes={};
      (r[3].data||[]).forEach(function(x){
        var o=SOC.reacoes[x.presenca_id]||(SOC.reacoes[x.presenca_id]={n:0,eu:false});
        o.n++;if(x.user_id===u)o.eu=true;
      });
      if(meusG.length){
        var g=await Promise.all([
          SB.cli.from('tr_grupos').select('*').in('id',meusG),
          SB.cli.from('tr_grupo_membros').select('*').in('grupo_id',meusG)
        ]);
        SOC.grupos=g[0].data||[];
        SOC.membros={};
        (g[1].data||[]).forEach(function(m){
          (SOC.membros[m.grupo_id]=SOC.membros[m.grupo_id]||[]).push(m.user_id);
        });
      }else{SOC.grupos=[];SOC.membros={}}
      await socPublicarPendentes();
    }
    SOC.carregado=true;
  }catch(e){SOC.erro=erroPt(e.message)}
  SOC.ocupado=false;
}

async function socCriarPerfil(apelido){
  if(!SB.cli||!SB.user)return false;
  for(var i=0;i<6;i++){
    var cod=gerarCodigo(6);
    var r=await SB.cli.from('tr_social_perfil').insert({
      user_id:SB.user.id,apelido:apelido,codigo:cod}).select().maybeSingle();
    if(!r.error){SOC.perfil=r.data;SOC.carregado=false;return true}
    if((r.error.message||'').indexOf('codigo')<0&&(r.error.message||'').indexOf('duplicate')<0){
      alert(erroPt(r.error.message));return false;
    }
  }
  alert('Não deu para gerar seu código. Tente de novo.');
  return false;
}
async function socSalvarPerfil(campo,valor){
  if(!temSocial())return;
  SOC.perfil[campo]=valor;
  var o={};o[campo]=valor;
  await SB.cli.from('tr_social_perfil').update(o).eq('user_id',SB.user.id);
}
async function socCriarGrupo(nome){
  if(!temSocial())return null;
  var r=await SB.cli.rpc('tr_criar_grupo',{p_nome:nome});
  if(r.error){alert(erroPt(r.error.message));return null}
  var g=(r.data&&r.data[0])||null;
  if(!g){alert('O grupo não foi criado. Tente de novo.');return null}
  SOC.carregado=false;await socCarregar(true);
  return g;
}
async function socEntrarGrupo(cod){
  if(!SB.cli||!SB.user)return null;
  var r=await SB.cli.rpc('tr_entrar_grupo',{cod:(cod||'').trim().toUpperCase()});
  if(r.error){alert(r.error.message.indexOf('convite')>=0?'Convite inválido ou expirado.':erroPt(r.error.message));return null}
  SOC.carregado=false;await socCarregar(true);
  return (r.data&&r.data[0])||null;
}
async function socSeguirPorCodigo(cod){
  if(!temSocial())return null;
  var r=await SB.cli.rpc('tr_achar_por_codigo',{cod:(cod||'').trim()});
  if(r.error){alert(erroPt(r.error.message));return null}
  var achou=(r.data&&r.data[0])||null;
  if(!achou){alert('Não achei ninguém com esse código.');return null}
  var i=await SB.cli.from('tr_seguindo').insert({seguidor:SB.user.id,seguido:achou.user_id});
  if(i.error&&(i.error.message||'').indexOf('duplicate')<0){alert(erroPt(i.error.message));return null}
  SOC.carregado=false;await socCarregar(true);

}
async function socSair(grupoId){
  if(!temSocial())return;
  await SB.cli.from('tr_grupo_membros').delete()
    .eq('grupo_id',grupoId).eq('user_id',SB.user.id);

/* presenca: so data e modalidade, nunca detalhe */
async function socPresenca(sessao){
  if(!temSocial()||!SOC.perfil.no_ranking)return;
  if(!sessao||sessao.arquivada)return;
  try{
    await SB.cli.from('tr_presenca').upsert(
      {id:sessao.id,user_id:SB.user.id,data:sessao.data,tipo:sessao.tipo,
       criado:horaPresenca(sessao)},{onConflict:'id'});
    SOC.carregado=false;
  }catch(e){}
}

/* Hora que vai pro feed. Usa o fim do treino quando existe; senao o meio-dia
   do dia. Nunca "agora", pra treino antigo nao aparecer como recem-feito. */
function horaPresenca(s){
  var t=s.fim||s.inicio;
  if(t){var d=new Date(t);if(!isNaN(d))return d.toISOString()}
  return new Date((s.data||hoje())+'T12:00:00').toISOString();
}

/* Forca: um toque, sem comentario. Troca na tela na hora e so depois grava. */
async function socReagir(id){
  if(!temSocial())return;
  var p=null;
  for(var i=0;i<SOC.presencas.length;i++)if(SOC.presencas[i].id===id){p=SOC.presencas[i];break}
  if(!p||p.user_id===SB.user.id)return;
  var r=SOC.reacoes[id]||(SOC.reacoes[id]={n:0,eu:false});
  var ligando=!r.eu;
  r.eu=ligando;r.n=Math.max(0,r.n+(ligando?1:-1));
  render();
  try{
    var q=ligando
      ? await SB.cli.from('tr_presenca_reacoes').insert({presenca_id:id,user_id:SB.user.id})
      : await SB.cli.from('tr_presenca_reacoes').delete()
          .eq('presenca_id',id).eq('user_id',SB.user.id);
    if(q&&q.error&&(q.error.message||'').indexOf('duplicate')<0){
      r.eu=!ligando;r.n=Math.max(0,r.n+(ligando?-1:1));render();
    }
  }catch(e){r.eu=!ligando;r.n=Math.max(0,r.n+(ligando?-1:1));render()}
}
async function socApagarPresenca(id){
  if(!temSocial())return;
  try{await SB.cli.from('tr_presenca').delete().eq('id',id)}catch(e){}
}

/* Treino registrado antes do social existir nunca subiu: a presenca so era
   publicada no fim da sessao. Aqui o que ficou para tras sobe de uma vez.
   So sobe data e modalidade, igual ao resto: nada de carga, nota ou duracao. */
async function socPublicarPendentes(){
  if(!temSocial()||!SOC.perfil.no_ranking)return 0;
  if(!db||!db.sessoes)return 0;
  var ini=inicioJanela(),u=SB.user.id;
  var jaTem={};
  SOC.presencas.forEach(function(p){if(p.user_id===u)jaTem[p.id]=p});
  var faltando=[],arquivadas=[];
  db.sessoes.forEach(function(s){
    if(!s.data||s.data<ini)return;
    if(s.aberta)return;
    if(s.arquivada){if(jaTem[s.id])arquivadas.push(s.id);return}
    var ex=jaTem[s.id];
    // já publicada e batendo com o aparelho: nada a fazer.
    // se a data divergir (conserto de fuso), republica por cima.
    if(ex&&ex.data===s.data&&ex.tipo===s.tipo)return;
    faltando.push({id:s.id,user_id:u,data:s.data,tipo:s.tipo,criado:horaPresenca(s)});
  });
  try{
    for(var i=0;i<faltando.length;i+=200){
      var lote=faltando.slice(i,i+200);
      var r=await SB.cli.from('tr_presenca').upsert(lote,{onConflict:'id'});
      if(r&&r.error)return 0;
      lote.forEach(function(x){
        var j=-1;
        for(var k=0;k<SOC.presencas.length;k++)if(SOC.presencas[k].id===x.id){j=k;break}
        if(j>=0)SOC.presencas[j]=x;else SOC.presencas.push(x);
      });
    }
    if(arquivadas.length){
      await SB.cli.from('tr_presenca').delete().in('id',arquivadas);
      SOC.presencas=SOC.presencas.filter(function(p){
        return !(p.user_id===u&&arquivadas.indexOf(p.id)>=0)});
    }
  }catch(e){return 0}
  return faltando.length;
}

/* ranking da semana */
function rankingSemana(){return rankingPeriodo(segunda())}
function rankingMes(){return rankingPeriodo(primeiroDoMes())}
function rankingPeriodo(ini){
  var conta={};
  SOC.presencas.forEach(function(p){
    if(p.data<ini)return;
    conta[p.user_id]=(conta[p.user_id]||0)+1;
  });
  // quem e do meu circulo
  var circulo={};
  Object.keys(SOC.membros).forEach(function(g){
    SOC.membros[g].forEach(function(u){circulo[u]=1});
  });
  circulo[SB.user.id]=1;
  Object.keys(conta).forEach(function(u){circulo[u]=1});
  return Object.keys(circulo).map(function(u){
    var meu=u===SB.user.id;
    return {user:u,n:conta[u]||0,
      nome:meu?'você':(SOC.pessoas[u]||'alguém'),
      ini:meu?iniciais((SOC.perfil&&SOC.perfil.apelido)||'eu'):iniciais(SOC.pessoas[u]||'?'),
      eu:meu};
  }).sort(function(a,b){return b.n-a.n||(a.eu?-1:1)});
}

function diasNoMes(d){
  var x=new Date((d||hoje()).slice(0,7)+'-01T12:00:00');
  x.setMonth(x.getMonth()+1);x.setDate(0);
  return x.getDate();
}
/* So no dia de hoje: dentro do dia o cabecalho ja diz a data */
function horaRel(p){
  if(!p||p.data!==hoje()||!p.criado)return '';
  var t=new Date(p.criado);if(isNaN(t))return '';
  // meio-dia cravado e a convencao de "treino sem hora registrada":
  // melhor nao mostrar relogio nenhum do que inventar uma recencia
  if(t.getHours()===12&&t.getMinutes()===0&&t.getSeconds()===0)return '';
  var min=Math.floor((Date.now()-t.getTime())/60000);
  if(min<0)min=0;
  if(min<5)return 'agora';
  if(min<60)return 'há '+min+'min';
  var h=Math.floor(min/60);
  if(h<24)return 'há '+h+'h';
  return '';
}

/* Meta da semana: o numero e seu, comparado com voce mesmo */
function metaSemana(){
  var m=Math.max(1,db.perfil.meta||5);
  return {feitos:semanaAtual(),meta:m};
}

/* O placar mostra os 3 primeiros e a vizinhanca de quem olha.
   Nunca a lista inteira com a pessoa no fim. */
function rankingRecorte(rk,tudo){
  var i,out=[];
  if(tudo||rk.length<=6){
    for(i=0;i<rk.length;i++)out.push({x:rk[i],pos:i+1});
    return out;
  }
  var meu=-1;
  for(i=0;i<rk.length;i++)if(rk[i].eu){meu=i;break}
  for(i=0;i<3;i++)out.push({x:rk[i],pos:i+1});
  if(meu<0||meu<3)return out;
  var ini=Math.max(3,meu-1),fim=Math.min(rk.length-1,meu+1);
  if(ini>3)out.push({pulo:ini-3});
  for(i=ini;i<=fim;i++)out.push({x:rk[i],pos:i+1});
  return out;
}

function rotuloDia(d){
  var hj=hoje();
  if(d===hj)return 'hoje';
  var o=new Date(hj+'T12:00:00');o.setDate(o.getDate()-1);
  if(d===dISO(o))return 'ontem';
  return diaSem(d)+' '+d.slice(8,10)+'/'+d.slice(5,7);
}

/* Sua semana: o numero e seu, comparado so com a sua meta.
   Com zero, vira o convite — e nao um placar com voce em ultimo. */
function cartaoMeta(destravado){
  var m=metaSemana();
  if(!m.feitos){
    return '<div class="mt zero an" style="animation-delay:40ms">'+
      '<div class="mz"><span class="mzi">'+svg('chama',20)+'</span>'+
      '<div class="f1"><div class="t" style="font-weight:700;font-size:17px;letter-spacing:-.015em">'+
      'Sua semana começa agora</div>'+
      '<div class="t2" style="margin-top:2px">0 de '+m.meta+' · ainda dá tempo</div></div></div>'+
      '<div class="mtb"></div><div style="height:15px"></div>'+
      '<button class="b1" onclick="ir(\'treinos\')">Registrar um treino</button></div>';
  }
  var pc=Math.min(100,Math.round(m.feitos/m.meta*100));
  var falta=Math.max(0,m.meta-m.feitos);
  return '<div class="mt an" style="animation-delay:40ms">'+
    '<div class="top" style="align-items:baseline;margin-bottom:11px">'+
    '<span class="lb">sua semana</span>'+
    '<span style="font-size:16px;font-weight:700">'+m.feitos+
    ' <span style="font-size:13px;font-weight:600;color:var(--tx2)">de '+m.meta+'</span></span></div>'+
    '<div class="mtb"><i style="width:'+pc+'%"></i></div>'+
    '<p class="t2" style="margin:10px 0 0;font-size:12px'+(falta?'':';color:var(--ac-t);font-weight:600')+'">'+
    (falta?('falta'+(falta===1?' 1 treino':'m '+falta+' treinos')+' pra bater sua meta')
          :'meta da semana batida')+'</p></div>';
}

/* O feed: quem se mexeu, dia a dia. Vem antes do placar de proposito. */
function feedSocial(){
  var ini=primeiroDoMes();
  var ls=SOC.presencas.filter(function(p){return p.data>=ini}).slice().sort(function(a,b){
    if(a.data!==b.data)return b.data.localeCompare(a.data);
    var ta=a.criado?new Date(a.criado).getTime():0,tb=b.criado?new Date(b.criado).getTime():0;
    return tb-ta||String(b.id).localeCompare(String(a.id));
  });
  if(!ls.length){
    return '<h2>No tatame</h2><div class="card"><p class="t2" style="margin:0;line-height:1.5">'+
      'Ninguém registrou treino em '+esc(rotuloMes())+' ainda. '+
      'O primeiro que treinar abre o mês.</p></div>';
  }
  var hj=ls.filter(function(p){return p.data===hoje()}).length;
  var dias={};ls.forEach(function(p){(dias[p.data]=dias[p.data]||[]).push(p)});
  var ord=Object.keys(dias).sort(function(a,b){return b.localeCompare(a)});
  var corte=ctx.lcTudo?ord.length:6;
  var h='<div class="top" style="margin:26px 0 4px;align-items:flex-end">'+
    '<h2 style="margin:0">No tatame</h2>'+
    '<span class="t2">'+(hj?hj+(hj===1?' treino hoje':' treinos hoje'):ls.length+' no mês')+'</span></div>'+
    '<div class="card an" style="padding:2px 14px;animation-delay:70ms">';

var _flashT=null;
function flash(txt){
  var e=document.getElementById('flash');
  if(!e){e=document.createElement('div');e.className='flash';e.id='flash';document.body.appendChild(e)}
  e.textContent=txt;
  e.offsetHeight;
  e.classList.add('on');
  clearTimeout(_flashT);
  _flashT=setTimeout(function(){e.classList.remove('on')},1800);
}
function copiar(txt,msg){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){flash(msg)});return;
    }
  }catch(e){}
  var i=document.createElement('textarea');i.value=txt;
  i.style.position='fixed';i.style.opacity='0';
  document.body.appendChild(i);i.select();
  try{document.execCommand('copy');flash(msg)}catch(e){alert(txt)}
  i.remove();
}

var LP={};
function pararLanding(){
  clearInterval(LP.a);clearInterval(LP.b);clearInterval(LP.d);clearTimeout(LP.c);
  if(LP.io)LP.io.disconnect();
  if(LP.sc)window.removeEventListener('scroll',LP.sc);
  LP={};
}
function animarLanding(){
  pararLanding();
  var reduz=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  var itens=document.querySelectorAll('.rv');
  if(reduz){Array.prototype.forEach.call(itens,function(e){e.classList.add('on')});return}

  // 1. revela ao rolar
  LP.io=new IntersectionObserver(function(es){
    es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('on');LP.io.unobserve(e.target)}});
  },{threshold:.15,rootMargin:'0px 0px -40px 0px'});
  Array.prototype.forEach.call(itens,function(e){LP.io.observe(e)});

  // 2. contadores e blocos da semana quando a seção aparece
  var demo=document.querySelector('.demo');
  if(demo){
    var io2=new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(!e.isIntersecting)return;
        io2.disconnect();
        document.querySelectorAll('[data-cnt2]').forEach(function(el){
          var alvo=+el.getAttribute('data-cnt2'),t0=null;
          function passo(t){if(!t0)t0=t;var pr=Math.min(1,(t-t0)/800),ea=1-Math.pow(1-pr,3);
            el.textContent=Math.round(alvo*ea);if(pr<1)requestAnimationFrame(passo)}
          requestAnimationFrame(passo);
        });
        var ds=document.querySelectorAll('#d-dots .dd');
        Array.prototype.forEach.call(ds,function(d,i){
          d.style.opacity='0';
          setTimeout(function(){d.style.opacity='1';d.classList.add('ap')},260+i*60);
        });
      });
    },{threshold:.4});
    io2.observe(demo);
  }

  // 3. manchete que troca
  var frases=['Todo treino','Todo rola','Toda série','Todo quilômetro'],ix=0;
  LP.a=setInterval(function(){
    var el=document.getElementById('rot');if(!el)return;
    el.classList.add('sai');
    setTimeout(function(){ix=(ix+1)%frases.length;el.textContent=frases[ix];el.classList.remove('sai')},300);
  },2600);

  // 4. demonstração em laço: check-in, aula, check-out e a conta subindo
  var ciclo=function(){
    var b=document.getElementById('j-btn'),n=document.getElementById('j-n'),
        txt=document.getElementById('j-txt'),
        tags=document.querySelectorAll('#j-tags span');
    if(!b)return;
    clearInterval(LP.b);
    var cq=document.getElementById('j-conq');
    b.textContent='Check-in';b.className='jb';
    n.textContent='94';txt.textContent='21 aulas nos últimos 3 meses';
    cq.classList.remove('on');
    Array.prototype.forEach.call(tags,function(t){t.classList.remove('on')});

    LP.c=setTimeout(function(){                       // toque no check-in
      b.classList.add('toque');
      LP.c=setTimeout(function(){
        b.classList.remove('toque');b.classList.add('viva');
        var seg=0;
        LP.b=setInterval(function(){
          seg+=4;
          b.innerHTML='<span class="live"></span>Em aula · '+Math.floor(seg/60)+':'+String(seg%60).padStart(2,'0');
        },70);
        LP.c=setTimeout(function(){                   // check-out
          clearInterval(LP.b);
          b.className='jb toque';b.textContent='Check-out';
          LP.c=setTimeout(function(){
            b.classList.remove('toque');
            n.textContent='95';n.parentElement.classList.add('ap');
            txt.textContent='22 aulas nos últimos 3 meses';
            Array.prototype.forEach.call(tags,function(t,i){
              setTimeout(function(){t.classList.add('on')},160+i*170);
            });
            setTimeout(function(){cq.classList.add('on')},760);
          },420);
        },2200);
      },240);
    },1200);
  };
  ciclo();
  LP.d=setInterval(ciclo,9000);

  // 5. barra fixa aparece depois que o topo sai da tela
  var topo=document.getElementById('topo-cta'),fix=document.getElementById('fix');
  LP.sc=function(){
    if(!topo||!fix)return;
    var r=topo.getBoundingClientRect();
    fix.classList.toggle('on',r.bottom<0);
  };
  window.addEventListener('scroll',LP.sc,{passive:true});
}

var TABELAS=['tr_exercicios','tr_treinos','tr_treino_exercicios','tr_sessoes','tr_series','tr_graduacoes','tr_tecnicas','tr_objetivos','tr_campeonatos','tr_conquistas'];

      colocacao:c.colocacao||null,notas:c.notas||'',criado:c.criado||hoje(),arquivado:!!c.arquivado}}),
    tr_conquistas:Object.keys(db.conq||{}).map(function(c){return {id:c+'@'+u,user_id:u,codigo:c,data:db.conq[c]}})

function aplicarRemoto(r){
  db.exercicios=r.tr_exercicios.map(function(e){return {id:e.id,nome:e.nome,grupo:e.grupo,equip:e.equip,ativo:e.ativo}});
  var porTreino={};
  r.tr_treino_exercicios.sort(function(a,b){return a.ordem-b.ordem}).forEach(function(i){
    (porTreino[i.treino_id]=porTreino[i.treino_id]||[]).push({id:i.id,ex:i.exercicio_id,series:i.series,reps:i.reps});
  });
  db.treinos=r.tr_treinos.sort(function(a,b){return a.ordem-b.ordem}).map(function(t){
    return {id:t.id,nome:t.nome,foco:t.foco,ordem:t.ordem,ativo:t.ativo,itens:porTreino[t.id]||[]}});
  db.sessoes=r.tr_sessoes.map(function(s){return {id:s.id,tipo:s.tipo,data:s.data,inicio:s.inicio,fim:s.fim,duracao:s.duracao,
    notas:s.notas,treino_id:s.treino_id,detalhes:s.detalhes||{},aberta:s.aberta,arquivada:s.arquivada}});
  db.series=r.tr_series.map(function(x){return {id:x.id,sessao_id:x.sessao_id,exercicio_id:x.exercicio_id,numero:x.numero,
    carga:x.carga==null?'':x.carga,reps:x.reps==null?'':x.reps,tipo:x.tipo,feita:x.feita}});
  db.graduacoes=r.tr_graduacoes.sort(function(a,b){return a.data.localeCompare(b.data)})
    .map(function(g){return {id:g.id,faixa:g.faixa,grau:g.grau,data:g.data,professor:g.professor,academia:g.academia}});
  if(!db.graduacoes.length)db.graduacoes=[{id:uid(),faixa:'Branca',grau:0,data:hoje(),professor:'',academia:''}];
  db.tecnicas=r.tr_tecnicas.map(function(t){return t.nome});
  db.objetivos=r.tr_objetivos.map(function(o){return {id:o.id,nome:o.nome,data:o.data,criado:o.criado,tipo:o.tipo,arquivado:o.arquivado}});
  db.campeonatos=(r.tr_campeonatos||[]).map(function(c){return {id:c.id,nome:c.nome,data:c.data,cidade:c.cidade,
    kimono:c.kimono,faixa:c.faixa,categoria:c.categoria,absoluto:c.absoluto,colocacao:c.colocacao||'',
    notas:c.notas,criado:c.criado,arquivado:c.arquivado}});
  // conquista é imutável: vale sempre a data mais antiga entre aparelho e nuvem
  var cq=db.conq||{};
  (r.tr_conquistas||[]).forEach(function(c){
    if(!cq[c.codigo]||c.data<cq[c.codigo])cq[c.codigo]=c.data;
  });
  db.conq=cq;
  // a nuvem guarda as datas como foram gravadas, inclusive as erradas
  repararFuso();
}

/* --- sincronização: envia só o que mudou, depois puxa tudo --- */
async function sincronizar(silencioso){
  if(!SB.cli||!SB.user||SB.ocupado)return;
  if(!navigator.onLine){if(!silencioso)alert('Sem internet agora. Seus treinos continuam salvos no aparelho.');return}
  SB.ocupado=true;SB.msg='Sincronizando...';if(!silencioso)render();
  try{
    var u=SB.user.id, locais=linhasLocais(u), snap={};
    try{var s=localStorage.getItem(chaveSnap());snap=s?JSON.parse(s):{}}catch(e){snap={}}

    // 1. envia o que mudou desde a última sincronização, na ordem das dependências
    for(var i=0;i<TABELAS.length;i++){
      var t=TABELAS[i],antes=snap[t]||{},mudou=[];
      locais[t].forEach(function(row){
        var j=JSON.stringify(row);
        if(antes[row.id]!==j)mudou.push(row);
      });
      if(mudou.length){
        for(var p=0;p<mudou.length;p+=400){
          var op={onConflict:'id'};
          if(t==='tr_conquistas')op.ignoreDuplicates=true;   // a primeira data vence
          var r=await SB.cli.from(t).upsert(mudou.slice(p,p+400),op);
          if(r.error)throw new Error(t+': '+r.error.message);
        }
      }
    }
    var nn=function(v){return v===''||v==null?null:v};
    var rp=await SB.cli.from('tr_perfis').upsert({user_id:u,nome:db.perfil.nome,meta:db.perfil.meta,
      descanso:db.perfil.descanso,principal:db.perfil.principal,
      whatsapp:nn(db.perfil.whatsapp),academia:nn(db.perfil.academia),
      nascimento:nn(db.perfil.nascimento),peso:nn(db.perfil.peso)===null?null:Number(db.perfil.peso),
      atualizado_em:new Date().toISOString()},{onConflict:'user_id'});
    if(rp.error)throw new Error('perfil: '+rp.error.message);

    // 2. puxa o estado completo de volta
    var remoto={};
    var respostas=await Promise.all(TABELAS.map(function(t){return SB.cli.from(t).select('*')}));
    for(var k=0;k<TABELAS.length;k++){
      if(respostas[k].error)throw new Error(TABELAS[k]+': '+respostas[k].error.message);
      remoto[TABELAS[k]]=respostas[k].data||[];
    }
    var qp=await SB.cli.from('tr_perfis').select('*').eq('user_id',u).maybeSingle();
    if(qp.data)db.perfil={nome:qp.data.nome,meta:qp.data.meta,descanso:qp.data.descanso,principal:qp.data.principal,
      whatsapp:qp.data.whatsapp||'',academia:qp.data.academia||'',nascimento:qp.data.nascimento||'',
      peso:qp.data.peso==null?'':String(qp.data.peso)};
    aplicarRemoto(remoto);
    await salvar();

    // 2b. o conserto de fuso roda ao aplicar o remoto, então as datas que ele
    // acertou precisam voltar à nuvem ANTES do snapshot — senão ficam
    // marcadas como "já enviadas" sem nunca terem subido.
    if(FUSO_MEXEU.length){
      var lf=linhasLocais(u);
      var corrigidas=lf.tr_sessoes.filter(function(r){return FUSO_MEXEU.indexOf(r.id)>=0});
      for(var pf=0;pf<corrigidas.length;pf+=400){
        var rf=await SB.cli.from('tr_sessoes').upsert(corrigidas.slice(pf,pf+400),{onConflict:'id'});
        if(rf.error)throw new Error('tr_sessoes: '+rf.error.message);
      }
      FUSO_MEXEU=[];
      SOC.carregado=false;   // a presença também carrega a data; recarrega e republica
    }

    // 3. guarda a nova referência do que já está na nuvem
    var novo={};
    var l2=linhasLocais(u);
    TABELAS.forEach(function(t){var m={};l2[t].forEach(function(r){m[r.id]=JSON.stringify(r)});novo[t]=m});
    try{localStorage.setItem(chaveSnap(),JSON.stringify(novo))}catch(e){}
    SB.ultima=new Date();SB.msg='';
  }catch(e){
    SB.msg='';
    if(!silencioso)alert('Erro na sincronização: '+e.message+'\n\nSeus dados continuam salvos no aparelho.');
  }
  SB.ocupado=false;render();
}
