<title>Treinos</title>
<style>
:root{
  --bg:#0A0A0C; --s1:#141417; --s2:#1E1E23; --s3:#2A2A31;
  --tx:#FFFFFF; --tx2:#9C9CA6; --tx3:#61616C;
  --br:#232329; --br2:#34343D;
  --ac:#FF2D46; --ac-d:#3B0F16; --ac-t:#FF7182;
  --ok:#FF2D46; --ok-d:#3B0F16;
  --bl:#FFFFFF; --bl-d:#26262C;
  --lm:#FFFFFF; --lm-d:#26262C;
  --rd:#FF2D46;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{height:-webkit-fill-available}
body{
  min-height:100vh;min-height:100dvh;
  background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.5;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
#app{max-width:520px;margin:0 auto;padding:0 16px;min-height:calc(100dvh - 30px)}
header{padding:calc(14px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:21px;font-weight:600;margin:0;letter-spacing:-.02em}
h2{font-size:13px;font-weight:600;color:var(--tx2);margin:22px 0 8px;text-transform:uppercase;letter-spacing:.07em}
.sub{font-size:13px;color:var(--tx3);margin:2px 0 0}
.card{background:var(--s1);border:1px solid var(--br);border-radius:var(--r);padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--s1);border-radius:var(--r);padding:12px 14px}
.stat .k{font-size:12px;color:var(--tx2)}
.stat .v{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.stat.a .v{color:var(--ac-t)}.stat.l .v{color:var(--lm)}
.stat .u{font-size:12px;color:var(--tx3)}
button,.btn{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.b1{display:block;width:100%;background:var(--ac);color:#fff;font-weight:600;padding:16px;border-radius:var(--r);font-size:16px;text-align:center;letter-spacing:-.01em}
.b1:active{opacity:.8}
.b2{display:block;width:100%;background:var(--s2);border:1px solid var(--br2);color:var(--tx);padding:13px;border-radius:var(--r);text-align:center;font-size:15px}
.b3{background:var(--s2);border:1px solid var(--br2);padding:8px 13px;border-radius:20px;font-size:13px;color:var(--tx2)}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--br)}
.row:last-child{border-bottom:0}
.ic{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.ic.m{background:var(--ac-d);color:var(--ac-t)}.ic.j{background:var(--bl-d)}.ic.c{background:var(--lm-d)}
.f1{flex:1;min-width:0}
.t{font-size:15px}
.t2{font-size:12px;color:var(--tx3)}
input,select,textarea{
  width:100%;font:inherit;background:var(--s2);color:var(--tx);
  border:1px solid var(--br2);border-radius:10px;padding:12px;outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
label{display:block;font-size:12px;color:var(--tx2);margin:14px 0 6px}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(10,10,12,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--br);display:flex;
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));
}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--tx3);padding:4px 0}
nav button .g{line-height:0;display:flex;align-items:center;justify-content:center;height:22px}
nav button.on{color:var(--ac)}
.pill{display:inline-block;font-size:12px;padding:4px 10px;border-radius:14px;background:var(--s2);color:var(--tx2);margin:0 6px 6px 0}
.pill.on{background:var(--ac-d);color:var(--ac-t)}
.pill.b{background:var(--bl-d);color:#A8B8FF}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 10px;border-radius:16px;background:var(--s2);color:var(--tx);margin:0 6px 6px 0}
.tag b{color:var(--tx3);font-weight:400}
.bar{height:6px;background:var(--s2);border-radius:4px;overflow:hidden;margin:8px 0 6px}
.bar>i{display:block;height:100%;background:var(--ac);border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.5)}62%{transform:scale(1.09)}100%{opacity:1;transform:scale(1)}}
@keyframes slideL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.82)}}
@keyframes glow{0%,100%{box-shadow:0 12px 34px -14px rgba(255,45,70,.75)}50%{box-shadow:0 12px 44px -12px rgba(255,45,70,1)}}
.an{animation:rise .42s cubic-bezier(.2,.85,.3,1) both}
.ap{animation:pop .34s cubic-bezier(.2,1.3,.45,1) both}
.al{animation:slideL .38s cubic-bezier(.2,.85,.3,1) both}
button,.cta,.b1,.b2,.b3,.row,.card{transition:transform .12s ease,opacity .12s ease}
button:active,.cta:active,.row:active{transform:scale(.975)}
.live{animation:pulse 1.4s ease-in-out infinite}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
async function salvar(){await store.set(db)}

function sessoesOk(){return db.sessoes.filter(function(s){return !s.aberta&&!s.arquivada})
  .sort(function(a,b){return (b.data+(b.inicio||'')).localeCompare(a.data+(a.inicio||''))})}

function semanaAtual(){
  var d=new Date(),dw=(d.getDay()+6)%7;
  d.setDate(d.getDate()-dw);d.setHours(0,0,0,0);
  var ini=d.toISOString().slice(0,10);
  return sessoesOk().filter(function(s){return s.data>=ini}).length;
}
function sequencia(){
  var dias={};sessoesOk().forEach(function(s){dias[s.data]=1});
  var n=0,d=new Date();
  if(!dias[d.toISOString().slice(0,10)])d.setDate(d.getDate()-1);
  while(dias[d.toISOString().slice(0,10)]){n++;d.setDate(d.getDate()-1)}
  return n;
}
function graduacoesReais(){
  // só conta graduação registrada como nova E com histórico de aulas antes dela.
  // corrigir o cadastro no primeiro acesso não é graduação.
  return (db.graduacoes||[]).filter(function(g,i){
    if(i===0||g.tipo!=='graduacao')return false;
    var antes=sessoesOk().filter(function(s){return s.tipo==='jiujitsu'&&s.data<g.data}).length;
    return antes>=10;
  }).length;
}
function mesesDesde(d){
  var a=new Date(d+'T12:00:00'),b=new Date();
  return Math.max(0,(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth()));
}
function aulasJiu(){
  var g=db.graduacoes[db.graduacoes.length-1];
  return sessoesOk().filter(function(s){return s.tipo==='jiujitsu'&&(!g||s.data>=g.data)}).length;
}
function proximoTreino(){
  var u=sessoesOk().find(function(s){return s.tipo==='musculacao'&&s.treino_id});
  var ts=db.treinos.filter(function(t){return t.ativo});
  if(!u)return ts[0];
  var i=ts.findIndex(function(t){return t.id===u.treino_id});
  return ts[(i+1)%ts.length]||ts[0];
}
function anterior(exId,n){
  var ss=sessoesOk().filter(function(s){return s.tipo==='musculacao'});
  for(var i=0;i<ss.length;i++){
    var f=db.series.filter(function(x){return x.sessao_id===ss[i].id&&x.exercicio_id===exId&&x.feita});
    if(f.length){var e=f.find(function(x){return x.numero===n});return e||f[f.length-1]}
  }
  return null;
}
function volume(sid){
  return db.series.filter(function(x){return x.sessao_id===sid&&x.feita})
    .reduce(function(a,x){return a+(+x.carga||0)*(+x.reps||0)},0);
}
function resumo(s){
  if(s.tipo==='musculacao'){
    var v=volume(s.id),t=treino(s.treino_id);
    return (t?t.nome:'Musculação')+(v?' · '+v.toLocaleString('pt-BR')+' kg':'');
  }
  if(s.tipo==='jiujitsu'){var d=s.detalhes||{};return 'Jiu-jitsu'+(d.tipo?' · '+d.tipo:'')}
  var d2=s.detalhes||{};
  return 'Corrida'+(d2.km?' · '+(+d2.km).toFixed(2).replace('.',',')+' km':'');
}
function detalhe(s){
  var p=[];
  if(s.duracao)p.push(s.duracao+' min');
  if(s.tipo==='corrida'&&s.detalhes&&s.detalhes.km&&s.duracao){
    var pc=(s.duracao*60)/s.detalhes.km;p.push(Math.floor(pc/60)+':'+String(Math.round(pc%60)).padStart(2,'0')+'/km');
  }
  return diaSem(s.data)+' '+dtBr(s.data)+(p.length?' · '+p.join(' · '):'');
}

/* ---------- tela ---------- */
function contar(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches){
    document.querySelectorAll('[data-cnt]').forEach(function(e){e.textContent=e.getAttribute('data-cnt')});return;
  }
  document.querySelectorAll('[data-cnt]').forEach(function(el){
    var alvo=+el.getAttribute('data-cnt')||0,dur=760,t0=null;
    if(!alvo){el.textContent='0';return}
    function passo(t){
      if(!t0)t0=t;
      var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
      el.textContent=Math.round(alvo*e);
      if(p<1)requestAnimationFrame(passo);
    }
    requestAnimationFrame(passo);
  });
}

async function iniciarTreino(tid){
  var t=treino(tid);
  var s={id:uid(),tipo:'musculacao',data:hoje(),inicio:new Date().toISOString(),fim:null,duracao:null,
    notas:'',treino_id:tid,detalhes:{},aberta:true,arquivada:false};
  db.sessoes.push(s);
  t.itens.forEach(function(it){
    for(var n=1;n<=it.series;n++){
      var a=anterior(it.ex,n);
      db.series.push({id:uid(),sessao_id:s.id,exercicio_id:it.ex,numero:n,
        carga:a?a.carga:'',reps:a?a.reps:it.reps,tipo:'normal',feita:false});
    }
  });
  await salvar();ctx={sid:s.id};view='sessao';acordar();render();
}
function retomar(sid){var s=db.sessoes.find(function(x){return x.id===sid});
  if(s.tipo==='musculacao'){ctx={sid:sid};view='sessao';acordar();render()}
  else{ctx={sid:sid};view=s.tipo==='jiujitsu'?'jiu':'corrida';render()}}

function vSessao(){
  var s=db.sessoes.find(function(x){return x.id===ctx.sid});
  if(!s)return vHome();
  var t=treino(s.treino_id);
  var dec=Math.round((Date.now()-new Date(s.inicio).getTime())/60000);
  var h='<header><div><h1>'+esc(t?t.nome:'Treino')+'</h1><p class="sub">'+(t?esc(t.foco):'')+' · '+dec+' min</p></div>'+
    '<button class="b3" onclick="finalizar()">Finalizar</button></header>';
  if(rest!==null)h+='<div class="rest"><div><div class="t2" style="color:var(--ok)">Descanso</div><div class="v num" id="rv">'+fmt(rest)+'</div></div>'+
    '<div style="display:flex;gap:8px"><button class="b3" onclick="addRest(-15)">−15s</button><button class="b3" onclick="addRest(15)">+15s</button><button class="b3" onclick="pararRest()">Pular</button></div></div>';
  var feitas=db.series.filter(function(x){return x.sessao_id===s.id&&x.feita}).length;
  var tot=db.series.filter(function(x){return x.sessao_id===s.id}).length;
  h+='<div class="bar"><i style="width:'+(tot?Math.round(feitas/tot*100):0)+'%"></i></div>'+
     '<p class="t2" style="margin:0 0 18px">'+feitas+' de '+tot+' séries · '+volume(s.id).toLocaleString('pt-BR')+' kg de volume</p>';
  (t?t.itens:[]).forEach(function(it){
    var e=ex(it.ex),ss=db.series.filter(function(x){return x.sessao_id===s.id&&x.exercicio_id===it.ex})
      .sort(function(a,b){return a.numero-b.numero});
    var a=anterior(it.ex,1),prox=ss.find(function(x){return !x.feita});
    h+='<div class="ex"><h3>'+esc(e.nome)+'</h3>'+
      '<p class="mut">'+(a?'Última vez: '+ss.length+'×'+a.reps+' com '+a.carga+' kg':'Primeira vez registrando')+'</p>'+
      '<div class="hd"><span></span><span>Carga (kg)</span><span>Reps</span><span></span></div>'+
      ss.map(function(x){
        return '<div class="sr '+(x.feita?'done':(prox&&prox.id===x.id?'now':''))+'">'+
          '<span class="n num">'+x.numero+'</span>'+
          '<input class="num" type="number" inputmode="decimal" value="'+esc(x.carga)+'" onchange="campo(\''+x.id+'\',\'carga\',this.value)">'+
          '<input class="num" type="number" inputmode="numeric" value="'+esc(x.reps)+'" onchange="campo(\''+x.id+'\',\'reps\',this.value)">'+
          '<button class="ck" onclick="marcar(\''+x.id+'\')">'+(x.feita?'✓':'○')+'</button></div>';
      }).join('')+'</div>';
  });
  h+='<label>Notas do treino</label><textarea rows="3" onchange="notaSessao(this.value)" placeholder="Como foi hoje?">'+esc(s.notas)+'</textarea>'+
     '<div style="height:16px"></div><button class="b1" onclick="finalizar()">Finalizar treino</button>'+
     '<div style="height:10px"></div><button class="b2" style="color:var(--tx3)" onclick="descartar(\''+s.id+'\')">Descartar este treino</button><div style="height:14px"></div>';
  return h;
}
async function descartar(id){
  var s=db.sessoes.find(function(x){return x.id===id});
  var f=db.series.filter(function(x){return x.sessao_id===id&&x.feita}).length;
  if(!confirm('Descartar '+nomeTipo(s.tipo).toLowerCase()+(f?' com '+f+' séries registradas':'')+'?\n\nEle sai das contagens e do histórico.'))return;
  s.aberta=false;s.arquivada=true;
  pararRest();dormir();await salvar();ir('home');
}
async function campo(id,c,v){var x=db.series.find(function(y){return y.id===id});x[c]=v;await salvar()}
async function notaSessao(v){var s=db.sessoes.find(function(x){return x.id===ctx.sid});s.notas=v;await salvar()}
async function marcar(id){
  var x=db.series.find(function(y){return y.id===id});
  x.feita=!x.feita;await salvar();
  if(x.feita)iniciarRest(db.perfil.descanso);else pararRest();
  render();
}
function iniciarRest(s){clearInterval(restT);rest=s;
  restT=setInterval(function(){
    rest--;var el=document.getElementById('rv');
    if(el)el.textContent=fmt(rest);
    if(rest<=0){pararRest();if(navigator.vibrate)navigator.vibrate([200,100,200]);render()}
  },1000);}
function pararRest(){clearInterval(restT);rest=null;var e=document.querySelector('.rest');if(e)e.remove()}
function addRest(n){if(rest!==null){rest+=n;var el=document.getElementById('rv');if(el)el.textContent=fmt(rest)}}
async function acordar(){try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch(e){}}
function dormir(){try{if(wl){wl.release();wl=null}}catch(e){}}
async function finalizar(){
  var s=db.sessoes.find(function(x){return x.id===ctx.sid});
  s.fim=new Date().toISOString();
  s.duracao=Math.max(1,Math.round((new Date(s.fim)-new Date(s.inicio))/60000));
  s.aberta=false;pararRest();dormir();await salvar();ir('home');checarConquistas();sincronizar(true);
}

/* ---------- jiu-jitsu ---------- */
function diasAte(d){
  var a=new Date(hoje()+'T12:00:00'),b=new Date(d+'T12:00:00');
  return Math.round((b-a)/86400000);
}
function objetivoAtivo(){
  return db.objetivos.filter(function(o){return !o.arquivado&&diasAte(o.data)>=0})
    .sort(function(a,b){return a.data.localeCompare(b.data)})[0];
}
function blocoObjetivo(){
  var o=objetivoAtivo();
  if(!o)return '<button class="b2" onclick="novoObjetivo()">+ Definir um objetivo</button>';
  var dd=diasAte(o.data);
  var feitos=sessoesOk().filter(function(s){return s.tipo==='jiujitsu'&&s.data>=o.criado&&s.data<=o.data}).length;
  var sem=dd>0?(feitos/Math.max(1,Math.ceil((new Date(hoje())-new Date(o.criado))/604800000))).toFixed(1).replace('.',','):'—';
  return '<div class="obj"><div class="lb" style="color:var(--ac-t)">Objetivo</div>'+
    '<div style="font-size:19px;font-weight:800;letter-spacing:-.02em;margin:4px 0 12px">'+esc(o.nome)+'</div>'+
    '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">'+
    '<div><div class="d num">'+(dd===0?'hoje':dd)+'</div><div class="lb" style="margin-top:6px">'+(dd===0?'é o dia':(dd===1?'dia restante':'dias restantes'))+'</div></div>'+
    '<div style="text-align:right"><div style="font-size:30px;font-weight:800;letter-spacing:-.04em" class="num">'+feitos+'</div>'+
    '<div class="lb" style="margin-top:6px">treinos até aqui</div></div></div>'+
    '<div class="t2" style="margin-top:12px;color:var(--ac-t)">'+dtBr(o.data)+(sem!=='—'?' · média de '+sem+' treinos por semana':'')+'</div>'+
    '<div style="display:flex;gap:8px;margin-top:12px"><button class="b3" onclick="novoObjetivo()">Trocar</button>'+
    '<button class="b3" onclick="encerrarObjetivo(\''+o.id+'\')">Encerrar</button></div></div>';
}
async function novoObjetivo(){
  var n=prompt('Qual o objetivo? (ex: Campeonato Paulista, Seletiva da academia)');if(!n)return;
  var d=prompt('Data do objetivo (formato AAAA-MM-DD)',hoje());
  if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d)){alert('Data inválida. Use o formato 2026-11-22.');return}
  db.objetivos.push({id:uid(),nome:n.trim(),data:d,criado:hoje(),tipo:'jiujitsu',arquivado:false});
  await salvar();render();
}
async function encerrarObjetivo(id){
  if(!confirm('Encerrar este objetivo?'))return;
  db.objetivos.find(function(o){return o.id===id}).arquivado=true;await salvar();render();
}

    '<div><div style="font-size:28px;font-weight:800;letter-spacing:-.04em" class="num">'+au+'</div>'+
    '<div class="lb" style="margin-top:4px">aulas na faixa</div></div>'+

async function checkin(){
  var s={id:uid(),tipo:'jiujitsu',data:hoje(),inicio:new Date().toISOString(),fim:null,duracao:null,
    notas:'',treino_id:null,detalhes:{tipo:'',kimono:true,tecnicas:[]},aberta:true,arquivada:false};
  db.sessoes.push(s);await salvar();render();
}
async function checkout(id){
  var s=db.sessoes.find(function(x){return x.id===id});
  s.fim=new Date().toISOString();
  s.duracao=Math.max(1,Math.round((new Date(s.fim)-new Date(s.inicio))/60000));
  s.aberta=false;await salvar();abrirDetalhe(s.id);checarConquistas();sincronizar(true);
}
function abrirDetalhe(id){

  var tipos=['Técnica','Posicional','Rola','Misto'];

  var el=document.createElement('div');el.className='sheet';el.id='sheet';
  el.innerHTML='<div><div class="top"><h1 style="font-size:18px">Como foi a aula</h1><button class="x" onclick="fechar()">✕</button></div>'+
    '<p class="t2">'+detalhe(s)+'</p>'+
    '<label>Tipo de treino</label><div>'+tipos.map(function(t){
      return '<button class="pill '+(d.tipo===t?'on':'')+'" onclick="setTipo(\''+id+'\',\''+t+'\')">'+t+'</button>'}).join('')+'</div>'+
    '<label>Kimono</label><div><button class="pill '+(d.kimono?'on':'')+'" onclick="setGi(\''+id+'\',true)">Com kimono</button>'+
    '<button class="pill '+(!d.kimono?'on':'')+'" onclick="setGi(\''+id+'\',false)">Sem kimono</button></div>'+
    '<label>Técnicas e posições</label>'+
    '<div id="tgs">'+(d.tecnicas||[]).map(function(t){
      return '<span class="tag">'+esc(t)+' <b onclick="remTec(\''+id+'\',\''+esc(t)+'\')">✕</b></span>'}).join('')+'</div>'+
    '<input id="ti" placeholder="raspagem da guarda aranha" onkeydown="if(event.key===\'Enter\')addTec(\''+id+'\')" style="margin-top:6px">'+
    (sug.length?'<div style="margin-top:8px">'+sug.map(function(t){
      return '<button class="pill" onclick="addTec(\''+id+'\',\''+esc(t)+'\')">+ '+esc(t)+'</button>'}).join('')+'</div>':'')+
    '<label>Anotações</label><textarea rows="4" id="nt" placeholder="O que você não quer esquecer">'+esc(s.notas)+'</textarea>'+
    '<div style="height:16px"></div><button class="b1" onclick="salvarDetalhe(\''+id+'\')">Salvar</button>'+
    '<div style="height:10px"></div><button class="b2" style="color:var(--tx3)" onclick="descartarFicha(\''+id+'\')">Descartar esta aula</button></div>';

function fechar(){var e=document.getElementById('sheet');if(e)e.remove();render()}
async function setTipo(id,t){var s=db.sessoes.find(function(x){return x.id===id});s.detalhes.tipo=t;await salvar();var n=document.getElementById('nt').value;s.notas=n;fechar();abrirDetalhe(id)}
async function setGi(id,v){var s=db.sessoes.find(function(x){return x.id===id});s.detalhes.kimono=v;await salvar();var n=document.getElementById('nt').value;s.notas=n;fechar();abrirDetalhe(id)}
async function addTec(id,val){
  var s=db.sessoes.find(function(x){return x.id===id});
  var i=document.getElementById('ti'),v=(val||i.value||'').trim().toLowerCase();
  if(!v)return;
  s.detalhes.tecnicas=s.detalhes.tecnicas||[];
  if(s.detalhes.tecnicas.indexOf(v)<0)s.detalhes.tecnicas.push(v);
  if(db.tecnicas.indexOf(v)<0)db.tecnicas.push(v);
  s.notas=document.getElementById('nt').value;
  await salvar();fechar();abrirDetalhe(id);
}
async function remTec(id,v){
  var s=db.sessoes.find(function(x){return x.id===id});
  s.detalhes.tecnicas=s.detalhes.tecnicas.filter(function(t){return t!==v});
  s.notas=document.getElementById('nt').value;await salvar();fechar();abrirDetalhe(id);
}
async function salvarDetalhe(id){
  var s=db.sessoes.find(function(x){return x.id===id});
  s.notas=document.getElementById('nt').value;await salvar();fechar();checarConquistas();sincronizar(true);
}

async function salvarCorrida(){
  var km=parseFloat((document.getElementById('ckm').value||'').replace(',','.'));

  var f=new Date();
  db.sessoes.push({id:uid(),tipo:'corrida',data:hoje(),inicio:new Date(f-mi*60000).toISOString(),
    fim:f.toISOString(),duracao:mi,notas:document.getElementById('cnt').value,treino_id:null,
    detalhes:{km:km,fonte:'manual'},aberta:false,arquivada:false});
  await salvar();ir('home');checarConquistas();sincronizar(true);
}

function filtrar(f){ctx.f=f;render()}
function verSessao(id){
  var s=db.sessoes.find(function(x){return x.id===id});
  if(s.tipo==='jiujitsu'){abrirDetalhe(id);return}
  if(s.tipo!=='musculacao')return;
  var ser=db.series.filter(function(x){return x.sessao_id===id&&x.feita}),por={};
  ser.forEach(function(x){(por[x.exercicio_id]=por[x.exercicio_id]||[]).push(x)});
  var el=document.createElement('div');el.className='sheet';el.id='sheet';
  el.innerHTML='<div><div class="top"><h1 style="font-size:18px">'+esc(resumo(s))+'</h1><button class="x" onclick="fechar()">✕</button></div>'+
    '<p class="t2">'+detalhe(s)+'</p><div style="height:10px"></div>'+
    Object.keys(por).map(function(k){
      return '<div style="margin-bottom:14px"><div class="t" style="font-weight:600">'+esc(ex(k).nome)+'</div><div class="t2">'+
        por[k].map(function(x){return x.carga+'kg × '+x.reps}).join('  ·  ')+'</div></div>'}).join('')+
    (s.notas?'<div class="t2" style="color:var(--tx2);border-top:1px solid var(--br);padding-top:10px">'+esc(s.notas)+'</div>':'')+
    '<div style="height:14px"></div><button class="b2" style="color:var(--tx3)" onclick="descartarFicha(\''+id+'\')">Descartar este treino</button>'+
    '<div style="height:10px"></div></div>';
  document.body.appendChild(el);
}
async function descartarFicha(id){
  var el=document.getElementById('sheet');if(el)el.remove();
  await descartar(id);
}

function importar(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=async function(){
    var d;
    try{d=JSON.parse(r.result)}catch(e){alert('Arquivo inválido: não é um JSON legível.');inp.value='';return}
    if(!d||!Array.isArray(d.exercicios)||!Array.isArray(d.sessoes)||!Array.isArray(d.series)){
      alert('Arquivo inválido: não parece um backup do Treinos.');inp.value='';return;
    }
    var fe=d.sessoes.filter(function(s){return !s.aberta}).length;
    var fs=d.series.filter(function(x){return x.feita}).length;
    if(!confirm('O backup tem '+fe+' sessões e '+fs+' séries.\n\nIsso vai substituir os dados deste aparelho. Continuar?')){inp.value='';return}
    // rede de segurança: guarda o estado atual antes de trocar
    try{await store.set(db)}catch(e){}
    d.perfil=d.perfil||{nome:'',meta:4,descanso:90,principal:'musculacao'};
    d.treinos=d.treinos||[];d.graduacoes=d.graduacoes&&d.graduacoes.length?d.graduacoes:[{id:uid(),faixa:'Branca',grau:0,data:hoje()}];
    d.tecnicas=d.tecnicas||[];
    db=d;await salvar();ir('home');
    alert('Backup restaurado. '+fe+' sessões carregadas.');
  };
  r.readAsText(f);
}

function diasTreinados(){var d={};sessoesOk().forEach(function(s){d[s.data]=1});return Object.keys(d).sort()}
function maiorSequencia(){
  var ds=diasTreinados(),melhor=0,atual=0,ant=null;
  ds.forEach(function(d){
    if(ant){var dif=(new Date(d)-new Date(ant))/86400000;atual=(dif===1)?atual+1:1}else atual=1;
    if(atual>melhor)melhor=atual;ant=d;
  });
  return melhor;
}
function totalKm(){return sessoesOk().filter(function(s){return s.tipo==='corrida'})
  .reduce(function(a,s){return a+(+(s.detalhes||{}).km||0)},0)}
function maiorCorrida(){return sessoesOk().filter(function(s){return s.tipo==='corrida'})
  .reduce(function(a,s){return Math.max(a,+(s.detalhes||{}).km||0)},0)}
function maiorVolume(){
  var v={};db.series.filter(function(x){return x.feita}).forEach(function(x){
    v[x.sessao_id]=(v[x.sessao_id]||0)+(+x.carga||0)*(+x.reps||0)});
  return Object.keys(v).reduce(function(a,k){return Math.max(a,v[k])},0);
}
function exerciciosComProgresso(){
  var por={},n=0;
  db.series.filter(function(x){return x.feita&&+x.carga>0}).forEach(function(x){
    (por[x.exercicio_id]=por[x.exercicio_id]||[]).push(+x.carga)});
  Object.keys(por).forEach(function(k){
    var l=por[k];if(l.length>3&&Math.max.apply(null,l)>l[l.length-1])n++;
  });
  return n;
}
function semanasSeguidasJiu(){
  var sem={};sessoesOk().filter(function(s){return s.tipo==='jiujitsu'}).forEach(function(s){
    var d=new Date(s.data+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));
    var k=d.toISOString().slice(0,10);sem[k]=(sem[k]||0)+1;
  });
  var ks=Object.keys(sem).sort(),melhor=0,atual=0,ant=null;
  ks.forEach(function(k){
    if(sem[k]<2){atual=0;ant=k;return}
    if(ant&&(new Date(k)-new Date(ant))/604800000===1)atual++;else atual=1;
    if(atual>melhor)melhor=atual;ant=k;
  });
  return melhor;
}

function checarConquistas(silencioso){

function proximoToast(){
  var c=FILA.shift();

  el.className='toast';
  el.innerHTML='<div class="ti">'+svg('conquista',20)+'</div><div><div class="tl">Conquista desbloqueada</div>'+
    '<div class="tn">'+esc(c.nome)+'</div></div>';

  document.body.appendChild(el);
  if(navigator.vibrate)navigator.vibrate([40,60,40]);
  setTimeout(function(){el.classList.add('on')},40);

    el.classList.remove('on');
    setTimeout(function(){el.remove();TOAST=null;proximoToast()},520);

      b=document.getElementById('cp-'+(campo==='kimono'?'k':'a')+'0');

async function salvarCamp(){
  var v=function(id){var e=document.getElementById(id);return e?e.value.trim():''};

  if(!CP.data){alert('Informe a data.');return}

  await salvar();fechar();checarConquistas();sincronizar(true);

async function apagarCamp(id){

var LP={};
function pararLanding(){
  clearInterval(LP.a);clearInterval(LP.b);clearInterval(LP.d);clearTimeout(LP.c);
  if(LP.io)LP.io.disconnect();
  if(LP.sc)window.removeEventListener('scroll',LP.sc);
  LP={};
}
function animarLanding(){
  pararLanding();
  var reduz=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  var itens=document.querySelectorAll('.rv');
  if(reduz){Array.prototype.forEach.call(itens,function(e){e.classList.add('on')});return}

  // 1. revela ao rolar
  LP.io=new IntersectionObserver(function(es){
    es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('on');LP.io.unobserve(e.target)}});
  },{threshold:.15,rootMargin:'0px 0px -40px 0px'});
  Array.prototype.forEach.call(itens,function(e){LP.io.observe(e)});

  // 2. contadores e blocos da semana quando a seção aparece
  var demo=document.querySelector('.demo');
  if(demo){
    var io2=new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(!e.isIntersecting)return;
        io2.disconnect();
        document.querySelectorAll('[data-cnt2]').forEach(function(el){
          var alvo=+el.getAttribute('data-cnt2'),t0=null;
          function passo(t){if(!t0)t0=t;var pr=Math.min(1,(t-t0)/800),ea=1-Math.pow(1-pr,3);
            el.textContent=Math.round(alvo*ea);if(pr<1)requestAnimationFrame(passo)}
          requestAnimationFrame(passo);
        });
        var ds=document.querySelectorAll('#d-dots .d');
        Array.prototype.forEach.call(ds,function(d,i){
          setTimeout(function(){if(d.getAttribute('data-on')==='1'){d.classList.add('on','ap');d.textContent='1'}},260+i*70);
        });
      });
    },{threshold:.4});
    io2.observe(demo);
  }

  // 3. manchete que troca
  var frases=['Todo treino','Todo rola','Toda série','Todo quilômetro'],ix=0;
  LP.a=setInterval(function(){
    var el=document.getElementById('rot');if(!el)return;
    el.classList.add('sai');
    setTimeout(function(){ix=(ix+1)%frases.length;el.textContent=frases[ix];el.classList.remove('sai')},300);
  },2600);

  // 4. demonstração em laço: check-in, aula, check-out e a conta subindo
  var ciclo=function(){
    var b=document.getElementById('j-btn'),n=document.getElementById('j-n'),
        txt=document.getElementById('j-txt'),
        tags=document.querySelectorAll('#j-tags span');
    if(!b)return;
    clearInterval(LP.b);
    var cq=document.getElementById('j-conq');
    b.textContent='Check-in';b.className='jb';
    n.textContent='94';txt.textContent='21 aulas nos últimos 3 meses';
    cq.classList.remove('on');
    Array.prototype.forEach.call(tags,function(t){t.classList.remove('on')});

    LP.c=setTimeout(function(){                       // toque no check-in
      b.classList.add('toque');
      LP.c=setTimeout(function(){
        b.classList.remove('toque');b.classList.add('viva');
        var seg=0;
        LP.b=setInterval(function(){
          seg+=4;
          b.innerHTML='<span class="live"></span>Em aula · '+Math.floor(seg/60)+':'+String(seg%60).padStart(2,'0');
        },70);
        LP.c=setTimeout(function(){                   // check-out
          clearInterval(LP.b);
          b.className='jb toque';b.textContent='Check-out';
          LP.c=setTimeout(function(){
            b.classList.remove('toque');
            n.textContent='95';n.parentElement.classList.add('ap');
            txt.textContent='22 aulas nos últimos 3 meses';
            Array.prototype.forEach.call(tags,function(t,i){
              setTimeout(function(){t.classList.add('on')},160+i*170);
            });
            setTimeout(function(){cq.classList.add('on')},760);
          },420);
        },2200);
      },240);
    },1200);
  };
  ciclo();
  LP.d=setInterval(ciclo,9000);

  // 5. barra fixa aparece depois que o topo sai da tela
  var topo=document.getElementById('topo-cta'),fix=document.getElementById('fix');
  LP.sc=function(){
    if(!topo||!fix)return;
    var r=topo.getBoundingClientRect();
    fix.classList.toggle('on',r.bottom<0);
  };
  window.addEventListener('scroll',LP.sc,{passive:true});
}

/* --- conversão entre o formato local e as tabelas --- */
function hashId(s){var h=0,i;for(i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0}return 't'+Math.abs(h).toString(36)}
var TABELAS=['tr_exercicios','tr_treinos','tr_treino_exercicios','tr_sessoes','tr_series','tr_graduacoes','tr_tecnicas','tr_objetivos','tr_campeonatos','tr_conquistas'];
function linhasLocais(u){
  var tex=[];
  db.treinos.forEach(function(t){(t.itens||[]).forEach(function(i,ix){
    if(!i.id)i.id=uid();
    tex.push({id:i.id,user_id:u,treino_id:t.id,exercicio_id:i.ex,series:+i.series||3,reps:+i.reps||10,ordem:ix+1});
  })});
  var n=function(v){return v===''||v==null?null:Number(v)};
  return {
    tr_exercicios:db.exercicios.map(function(e){return {id:e.id,user_id:u,nome:e.nome,grupo:e.grupo||'Outros',equip:e.equip||'Livre',ativo:e.ativo!==false}}),
    tr_treinos:db.treinos.map(function(t){return {id:t.id,user_id:u,nome:t.nome,foco:t.foco||'',ordem:+t.ordem||1,ativo:t.ativo!==false}}),
    tr_treino_exercicios:tex,
    tr_sessoes:db.sessoes.map(function(s){return {id:s.id,user_id:u,tipo:s.tipo,data:s.data,inicio:s.inicio,fim:s.fim,
      duracao:s.duracao||null,notas:s.notas||'',treino_id:s.treino_id||null,detalhes:s.detalhes||{},aberta:!!s.aberta,arquivada:!!s.arquivada}}),
    tr_series:db.series.map(function(x){return {id:x.id,user_id:u,sessao_id:x.sessao_id,exercicio_id:x.exercicio_id,
      numero:+x.numero,carga:n(x.carga),reps:n(x.reps),tipo:x.tipo||'normal',feita:!!x.feita}}),
    tr_graduacoes:db.graduacoes.map(function(g){return {id:g.id,user_id:u,faixa:g.faixa,grau:+g.grau||0,data:g.data,professor:g.professor||'',academia:g.academia||''}}),
    tr_tecnicas:db.tecnicas.map(function(t){return {id:hashId(t),user_id:u,nome:t}}),
    tr_objetivos:db.objetivos.map(function(o){return {id:o.id,user_id:u,nome:o.nome,data:o.data,criado:o.criado||hoje(),tipo:o.tipo||'jiujitsu',arquivado:!!o.arquivado}}),
    tr_campeonatos:(db.campeonatos||[]).map(function(c){return {id:c.id,user_id:u,nome:c.nome,data:c.data,
      cidade:c.cidade||'',kimono:!!c.kimono,faixa:c.faixa||'',categoria:c.categoria||'',absoluto:!!c.absoluto,
      colocacao:c.colocacao||null,notas:c.notas||'',criado:c.criado||hoje(),arquivado:!!c.arquivado}}),
    tr_conquistas:Object.keys(db.conq||{}).map(function(c){return {id:c+'@'+u,user_id:u,codigo:c,data:db.conq[c]}})
  };
}
function aplicarRemoto(r){
  db.exercicios=r.tr_exercicios.map(function(e){return {id:e.id,nome:e.nome,grupo:e.grupo,equip:e.equip,ativo:e.ativo}});
  var porTreino={};
  r.tr_treino_exercicios.sort(function(a,b){return a.ordem-b.ordem}).forEach(function(i){
    (porTreino[i.treino_id]=porTreino[i.treino_id]||[]).push({id:i.id,ex:i.exercicio_id,series:i.series,reps:i.reps});
  });
  db.treinos=r.tr_treinos.sort(function(a,b){return a.ordem-b.ordem}).map(function(t){
    return {id:t.id,nome:t.nome,foco:t.foco,ordem:t.ordem,ativo:t.ativo,itens:porTreino[t.id]||[]}});
  db.sessoes=r.tr_sessoes.map(function(s){return {id:s.id,tipo:s.tipo,data:s.data,inicio:s.inicio,fim:s.fim,duracao:s.duracao,
    notas:s.notas,treino_id:s.treino_id,detalhes:s.detalhes||{},aberta:s.aberta,arquivada:s.arquivada}});
  db.series=r.tr_series.map(function(x){return {id:x.id,sessao_id:x.sessao_id,exercicio_id:x.exercicio_id,numero:x.numero,
    carga:x.carga==null?'':x.carga,reps:x.reps==null?'':x.reps,tipo:x.tipo,feita:x.feita}});
  db.graduacoes=r.tr_graduacoes.sort(function(a,b){return a.data.localeCompare(b.data)})
    .map(function(g){return {id:g.id,faixa:g.faixa,grau:g.grau,data:g.data,professor:g.professor,academia:g.academia}});
  if(!db.graduacoes.length)db.graduacoes=[{id:uid(),faixa:'Branca',grau:0,data:hoje(),professor:'',academia:''}];
  db.tecnicas=r.tr_tecnicas.map(function(t){return t.nome});
  db.objetivos=r.tr_objetivos.map(function(o){return {id:o.id,nome:o.nome,data:o.data,criado:o.criado,tipo:o.tipo,arquivado:o.arquivado}});
  db.campeonatos=(r.tr_campeonatos||[]).map(function(c){return {id:c.id,nome:c.nome,data:c.data,cidade:c.cidade,
    kimono:c.kimono,faixa:c.faixa,categoria:c.categoria,absoluto:c.absoluto,colocacao:c.colocacao||'',
    notas:c.notas,criado:c.criado,arquivado:c.arquivado}});
  // conquista é imutável: vale sempre a data mais antiga entre aparelho e nuvem
  var cq=db.conq||{};
  (r.tr_conquistas||[]).forEach(function(c){
    if(!cq[c.codigo]||c.data<cq[c.codigo])cq[c.codigo]=c.data;
  });
  db.conq=cq;
}

/* --- sincronização: envia só o que mudou, depois puxa tudo --- */
async function sincronizar(silencioso){
  if(!SB.cli||!SB.user||SB.ocupado)return;
  if(!navigator.onLine){if(!silencioso)alert('Sem internet agora. Seus treinos continuam salvos no aparelho.');return}
  SB.ocupado=true;SB.msg='Sincronizando...';if(!silencioso)render();
  try{
    var u=SB.user.id, locais=linhasLocais(u), snap={};
    try{var s=localStorage.getItem(chaveSnap());snap=s?JSON.parse(s):{}}catch(e){snap={}}

    // 1. envia o que mudou desde a última sincronização, na ordem das dependências
    for(var i=0;i<TABELAS.length;i++){
      var t=TABELAS[i],antes=snap[t]||{},mudou=[];
      locais[t].forEach(function(row){
        var j=JSON.stringify(row);
        if(antes[row.id]!==j)mudou.push(row);
      });
      if(mudou.length){
        for(var p=0;p<mudou.length;p+=400){
          var op={onConflict:'id'};
          if(t==='tr_conquistas')op.ignoreDuplicates=true;   // a primeira data vence
          var r=await SB.cli.from(t).upsert(mudou.slice(p,p+400),op);
          if(r.error)throw new Error(t+': '+r.error.message);
        }
      }
    }
    var nn=function(v){return v===''||v==null?null:v};
    var rp=await SB.cli.from('tr_perfis').upsert({user_id:u,nome:db.perfil.nome,meta:db.perfil.meta,
      descanso:db.perfil.descanso,principal:db.perfil.principal,
      whatsapp:nn(db.perfil.whatsapp),academia:nn(db.perfil.academia),
      nascimento:nn(db.perfil.nascimento),peso:nn(db.perfil.peso)===null?null:Number(db.perfil.peso),
      atualizado_em:new Date().toISOString()},{onConflict:'user_id'});
    if(rp.error)throw new Error('perfil: '+rp.error.message);

    // 2. puxa o estado completo de volta
    var remoto={};
    for(var k=0;k<TABELAS.length;k++){
      var q=await SB.cli.from(TABELAS[k]).select('*');
      if(q.error)throw new Error(TABELAS[k]+': '+q.error.message);
      remoto[TABELAS[k]]=q.data||[];
    }
    var qp=await SB.cli.from('tr_perfis').select('*').eq('user_id',u).maybeSingle();
    if(qp.data)db.perfil={nome:qp.data.nome,meta:qp.data.meta,descanso:qp.data.descanso,principal:qp.data.principal,
      whatsapp:qp.data.whatsapp||'',academia:qp.data.academia||'',nascimento:qp.data.nascimento||'',
      peso:qp.data.peso==null?'':String(qp.data.peso)};
    aplicarRemoto(remoto);
    await salvar();

    // 3. guarda a nova referência do que já está na nuvem
    var novo={};
    var l2=linhasLocais(u);
    TABELAS.forEach(function(t){var m={};l2[t].forEach(function(r){m[r.id]=JSON.stringify(r)});novo[t]=m});
    try{localStorage.setItem(chaveSnap(),JSON.stringify(novo))}catch(e){}
    SB.ultima=new Date();SB.msg='';
  }catch(e){
    SB.msg='';
    if(!silencioso)alert('Erro na sincronização: '+e.message+'\n\nSeus dados continuam salvos no aparelho.');
  }
  SB.ocupado=false;render();
}

      '<button class="b1" onclick="irAuth(false)">Entrar</button></div>';
  }
  return h+'<div class="card"><div class="t" style="font-weight:600">'+esc(SB.user.email)+'</div>'+

    '<div style="height:14px"></div><button class="b1" onclick="sincronizar()">Sincronizar agora</button>'+
    '<div style="height:10px"></div><button class="b2" style="color:var(--tx3)" onclick="sair()">Sair da conta</button></div>';
}

/* ---------- boot ---------- */
async function aposLogin(){
  db=await store.get();
  if(!db){
    // primeiro login neste aparelho: aproveita dados locais anteriores, se houver
    var legado=await store.get(KEY_LEGADO);
    db=legado&&legado.exercicios?legado:vazio();
  }
  migrar();
  await salvar();
  checarConquistas(true);
  view='home';render();
  await sincronizar(true);
  checarConquistas(true);
  if(!db.perfil||!db.perfil.nome){view='onboard';ctx={passo:1,tmp:{}}}
  render();
}
function migrar(){
  if(!db.perfil)db.perfil={nome:'',meta:4,descanso:90,principal:'musculacao'};
  if(!db.perfil.principal)db.perfil.principal='musculacao';
  ['whatsapp','academia','nascimento','peso'].forEach(function(c){if(db.perfil[c]==null)db.perfil[c]=''});
  if(!db.objetivos)db.objetivos=[];
  if(!db.campeonatos)db.campeonatos=[];
  if(!db.tecnicas)db.tecnicas=[];
  if(!db.graduacoes||!db.graduacoes.length)db.graduacoes=[{id:uid(),faixa:'Branca',grau:0,data:hoje(),professor:'',academia:''}];
  (db.treinos||[]).forEach(function(t){(t.itens||[]).forEach(function(i){if(!i.id)i.id=uid()})});
}
