<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<link rel="icon" type="image/png" sizes="192x192" href="icone-now-192.png">
<link rel="apple-touch-icon" href="icone-now-180.png">
<link rel="manifest" href="manifest-now.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino Now">
<title>Treino Now</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" onerror="void 0"></script>
<style>
:root{
  --bg:#0d0f12; --card:#161a20; --card2:#1d222a; --line:#262c36;
  --txt:#f2f4f7; --mut:#8b94a3; --acc:#c6f432; --acc-ink:#11140a; --danger:#ff6b6b;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(40px + env(safe-area-inset-bottom))}
body.hasbar{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.wrap{max-width:480px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{cursor:not-allowed}
input,select,textarea{font:inherit}

h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:26px 0 10px;font-weight:600}
.brand{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:700}

/* home */
.hhero{padding:28px 0 6px}
.hhero h1{font-size:28px;line-height:1.15;margin:10px 0 6px;letter-spacing:-.02em}
.hhero p{color:var(--mut);font-size:15px;margin:0;line-height:1.45}
.fchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:16px 0 12px;padding-bottom:2px}
.inst{display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,#232d0a,#161a20);border:1px solid #3d4d12;border-radius:16px;padding:12px;margin:14px 0 4px;position:relative}
.inst .ic{width:42px;height:42px;border-radius:10px;background:var(--acc);display:grid;place-items:center;flex:none}
.inst .tx b{font-size:14px;display:block}.inst .tx span{font-size:11.5px;color:var(--mut);line-height:1.3;display:block}
.inst .go{margin-left:auto;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:12px;border:0;border-radius:10px;padding:9px 11px;white-space:nowrap;font-family:inherit;cursor:pointer}
.inst .x{position:absolute;top:-9px;right:-5px;width:26px;height:26px;border-radius:50%;background:var(--card2);border:1px solid var(--line);color:var(--mut);padding:0;display:grid;place-items:center;cursor:pointer}.inst .x svg{display:block}
.itabs{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin:10px 0}.itabs button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:13px;padding:8px;border-radius:9px;cursor:pointer}.itabs .on{background:var(--acc);color:var(--acc-ink);font-weight:800}
.iwarn{background:#2c240a;border:1px solid #5a4710;color:#f5c542;border-radius:12px;padding:9px 11px;font-size:12.5px;line-height:1.4;margin-bottom:10px}
.ist{display:flex;gap:11px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:9px}
.ist .n{width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-weight:900;font-size:13px;display:grid;place-items:center;flex:none}
.ist b{font-size:14px;display:block}.ist span.d{font-size:12px;color:var(--mut);line-height:1.4;display:block;margin-top:2px}
.ill{margin-top:8px;border-radius:10px;background:var(--bg);border:1px solid var(--line);padding:8px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px}
.safbar{display:flex;justify-content:space-around;align-items:center;width:100%;color:var(--mut)}.hl{outline:2px solid var(--acc);outline-offset:3px;border-radius:7px;color:var(--acc)}
.imenu{width:100%;background:var(--card);border-radius:10px;padding:2px 0}.imenu div{padding:8px 10px;font-size:12px;display:flex;justify-content:space-between;color:#c9ced6}.imenu .hl{margin:0 4px;outline-offset:-2px;padding:7px 8px}
.cstrip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:6px;color:var(--txt);font:inherit;cursor:pointer}
.cstrip .m{width:38px;height:38px;border-radius:50%;background:#1a2108;border:2px solid var(--acc);display:grid;place-items:center;font-size:18px;flex:none}
.cstrip .x{flex:1;min-width:0}.cstrip .x b{font-size:14px;display:block}.cstrip .pbar{margin:7px 0 0;height:6px}.cstrip .ch{color:var(--mut);font-size:22px}
.hrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13px}.hrow small{color:var(--mut);display:block;margin-top:2px}
.fchips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:10px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.plist{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.pro{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.pro:active{background:var(--card2)}
.avatar{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,hsl(var(--h) 85% 62%),hsl(calc(var(--h) + 40) 65% 42%));color:#10130a;display:grid;place-items:center;font-weight:800;font-size:23px;flex:none}
.avatar.big{width:84px;height:84px;font-size:32px}
.pinfo{flex:1;min-width:0}
.pn{font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px}
.pm{color:var(--mut);font-size:13px;margin-top:2px}
.pr{font-size:13px;margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.price{text-align:right;flex:none}
.price b{display:block;font-size:21px;color:var(--acc)}
.price span{font-size:11px;color:var(--mut)}
.tick{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:900;flex:none}
.tag{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.tag.pend{color:#ffb86b;border-color:#4a3418;background:#241a0c}
.soon{margin-top:22px;padding:16px;border:1px dashed var(--line);border-radius:var(--r);color:var(--mut);font-size:14px;line-height:1.5}
.soon b{color:var(--txt)}

/* minhas reservas (aluno) */
.mres{margin-top:18px}
.mr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;font-size:14px;line-height:1.5}
.mr .bh{margin-bottom:4px}

/* perfil do profissional */
.back{display:inline-flex;align-items:center;gap:6px;padding:18px 0 6px;color:var(--mut);font-size:15px}
.phero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 0 4px}
.phero h1{font-size:24px;margin:14px 0 4px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.phero .sub2{color:var(--mut);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;align-items:stretch}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;min-height:88px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.stat b{display:block;font-size:15px;line-height:1.25;text-wrap:balance}
.stat span{font-size:11px;color:var(--mut);display:block;margin-top:4px;line-height:1.3;text-wrap:balance}
.about{color:#c9d0db;font-size:15px;line-height:1.55;margin:0;white-space:pre-line}

/* dias */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:58px;padding:10px 0;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center}
.day small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase}
.day b{font-size:19px;display:block;margin-top:2px}
.day.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.day.on small{color:var(--acc-ink);opacity:.7}
.day.off{opacity:.35}

/* horarios */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:13px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:15px}
.slot.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.slot.busy{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.slot.blk{background:#2a1a1a;border-color:#4a2a2a;color:var(--danger)}
.empty{color:var(--mut);font-size:14px;padding:14px;background:var(--card);border-radius:12px;border:1px dashed var(--line)}

/* barra inferior */
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);display:none}
.bar.show{display:block}
.cta{display:block;width:100%;max-width:480px;margin:0 auto;padding:17px;border-radius:16px;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:16px}
.cta:disabled{background:var(--card2);color:var(--mut)}

.foot{text-align:center;margin-top:34px;display:flex;justify-content:center;gap:18px}
.foot button{color:var(--mut);font-size:13px;text-decoration:underline}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:30}
.ov.show{display:flex}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:20px}
.sub{color:var(--mut);font-size:14px;margin-bottom:16px;line-height:1.4}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
input,select,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:16px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
.resumo{background:var(--card2);border-radius:14px;padding:14px;font-size:14px;line-height:1.6;margin-bottom:6px}
.resumo b{color:var(--acc)}
.fee{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;color:#c9d0db}
.fee.tot{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-weight:800;color:var(--txt);font-size:16px}
.fee.tot span:last-child{color:var(--acc)}
.row{display:flex;gap:10px;margin-top:18px}
.btn2{flex:1;padding:15px;border-radius:14px;background:var(--card2);font-weight:600}
.btn1{flex:2;padding:15px;border-radius:14px;background:var(--acc);color:var(--acc-ink);font-weight:800}
.btn1:disabled{opacity:.6}
.ok{width:64px;height:64px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-size:32px;margin:6px auto 14px}
.ok.wait{background:var(--card2);color:#ffb86b}
.center{text-align:center}
.err{color:var(--danger);font-size:13px;margin-top:8px;min-height:16px}
.warn{background:#241a0c;color:#ffb86b;border:1px solid #4a3418;border-radius:12px;padding:12px;font-size:13px;line-height:1.5}
.code{font-size:34px;font-weight:800;letter-spacing:.12em;color:var(--acc);text-align:center;margin:10px 0 16px}

/* pix */
.pixbox{background:var(--card2);border-radius:16px;padding:16px;text-align:center}
.pixval{font-size:30px;font-weight:800;color:var(--acc);margin-bottom:10px}
.qr{display:inline-block;background:#fff;padding:10px;border-radius:12px;margin-bottom:10px}
.qr:empty{display:none}
.pcode{font-size:11px;word-break:break-all;color:var(--mut);background:var(--bg);border-radius:10px;padding:10px;margin:8px 0 12px;max-height:72px;overflow:auto;text-align:left}

/* painéis */
.panel{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;display:none;padding-top:env(safe-area-inset-top)}
.panel.show{display:block}
.ptop{display:flex;align-items:center;justify-content:space-between;padding:18px 0;gap:8px}
.ptop b{font-size:18px;flex:1}
.x{padding:8px 12px;border-radius:10px;background:var(--card);font-size:14px}
.book{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.book .when{min-width:62px;text-align:center}
.book .when b{display:block;font-size:18px;color:var(--acc)}
.book .when small{color:var(--mut);font-size:12px}
.book .info{flex:1;font-size:14px;line-height:1.4}
.book .info span{color:var(--mut)}
.mini{padding:8px 10px;border-radius:10px;background:var(--card2);font-size:13px}
.hint{color:var(--mut);font-size:13px;margin:-4px 0 10px;line-height:1.4}
.dl{font-size:14px;font-weight:600;margin:14px 0 6px}
.hgrid{display:flex;flex-wrap:wrap;gap:6px}
.hb{padding:9px 0;width:calc((100% - 30px)/6);border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px}
.hb.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
#perfil,#atab{padding-bottom:30px}

/* gerenciador */
.tabs{display:flex;gap:8px;margin:4px 0 6px}
.tab{flex:1;padding:11px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600}
.tab.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.kpi b{display:block;font-size:16px;color:var(--acc)}
.kpi span{font-size:11px;color:var(--mut);display:block;margin-top:3px;line-height:1.3}
.bk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;font-size:14px;line-height:1.5}
.bh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.badge{font-size:11px;padding:3px 9px;border-radius:999px;font-weight:700;white-space:nowrap}
.st-ag{background:#241a0c;color:#ffb86b;border:1px solid #4a3418}
.st-pg{background:#1a2108;color:var(--acc);border:1px solid #3b4a14}
.st-rp{background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.bm{color:var(--mut);font-size:13px;margin-top:4px}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sbtn{padding:10px 12px;border-radius:10px;background:var(--card2);font-size:13px;font-weight:600}
.sbtn.pri{background:var(--acc);color:var(--acc-ink)}
.sbtn.del{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:12px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw;text-align:center}

img.avatar{object-fit:cover;background:var(--card2);display:block}
/* confirmação / ingresso */
.tkt{background:var(--card2);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:4px}
.tkt .h{display:flex;gap:12px;align-items:center;padding:14px}
.tkt .h .avatar{width:48px;height:48px;font-size:19px}
.tkt .n{font-weight:700;font-size:16px}.tkt .m{color:var(--mut);font-size:13px;margin-top:2px}
.tkt .cut{border-top:2px dashed var(--line);margin:0 14px}
.tkt .b{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.tkt .b small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.tkt .b b{font-size:17px;display:block;margin-top:3px}.tkt .b .full{grid-column:1/3}
.btnw{display:block;width:100%;text-align:center;padding:15px;border-radius:14px;font-weight:800;font-size:15px;margin-top:10px;text-decoration:none}
.btnw.pri{background:var(--acc);color:var(--acc-ink)}
.btnw.sec{background:var(--card2);color:var(--txt);font-weight:600;border:1px solid var(--line)}
.btnw.ghost{color:var(--mut);font-weight:600}
/* reservas do aluno */
.mr .when{display:flex;gap:12px;align-items:center;margin:10px 0 0}
.mr .dt{background:var(--card2);border-radius:12px;padding:8px 12px;text-align:center;min-width:62px}
.mr .dt b{display:block;font-size:20px;color:var(--acc);line-height:1.1}.mr .dt small{color:var(--mut);font-size:11px;text-transform:uppercase;display:block}
.mr .wx{font-size:14px;line-height:1.45}.mr .wx span{color:var(--mut)}
/* conquistas */
.lvl{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.lvl .r{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.lvl b{font-size:18px}.lvl span{color:var(--mut);font-size:12px}
.pbar{height:8px;border-radius:99px;background:var(--card2);margin:10px 0 6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.bd .ic{width:48px;height:48px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:23px;background:#1a2108;border:2px solid var(--acc)}
.bd b{font-size:12px;display:block;line-height:1.25}.bd small{color:var(--mut);font-size:10.5px;display:block;margin-top:3px;line-height:1.25}
.bd.off{opacity:.5}.bd.off .ic{background:var(--card2);border:2px dashed var(--line);filter:grayscale(1)}
.bd.new{border-color:var(--acc)}
.ntag{display:inline-block;font-size:9.5px;background:var(--acc);color:var(--acc-ink);border-radius:99px;padding:2px 7px;font-weight:800;margin-top:4px}
.shcv{width:100%;height:auto;border-radius:14px;margin-top:12px;background:conic-gradient(#2a2e36 25%,#1c1f26 0 50%,#2a2e36 0 75%,#1c1f26 0) 0 0/24px 24px;display:block}
</style>
</head>
<body>

<!-- HOME / VITRINE -->
<div class="wrap" id="home">
  <div class="hhero">
    <div class="brand">Treino Now</div>
    <h1>Aula avulsa com quem entende.</h1>
    <p>Escolha o profissional, o local e o horário. Sem mensalidade, sem plano.</p>
  </div>
  <div id="instcard"></div>
  <div class="mres" id="minhas"></div>
  <div class="fchips" id="filtros"></div>
  <div class="plist" id="plist"></div>
  <div id="vconq"></div>
  <div id="acct" class="hint" style="text-align:center;margin:16px 0 0"></div>
  <div class="soon"><b>Em breve:</b> Futevôlei, Corrida e Beach Tênis.<div class="btns"><button class="sbtn pri" id="avisarMod">🔔 Avisar quando chegar</button></div></div>
  <div class="foot"><button id="openInst" style="display:none">Instalar app</button><button id="openPanel">Área do profissional</button><button id="openAdmin">Gerenciador</button></div>
</div>

<!-- PERFIL DO PROFISSIONAL -->
<div class="wrap" id="prof" style="display:none">
  <button class="back" id="back">← Voltar</button>
  <div class="phero" id="phero"></div>
  <div class="stats" id="stats"></div>

  <h2>Sobre</h2>
  <p class="about" id="about"></p>

  <h2>Onde você quer treinar</h2>
  <div class="chips" id="acad"></div>

  <h2>Escolha o dia</h2>
  <div class="days" id="days"></div>

  <h2>Horários livres</h2>
  <div class="hint" id="precoDia" style="margin:-4px 0 10px"></div>
  <div class="slots" id="slots"></div>
  <button class="sbtn" id="avisarPro" style="margin-top:14px;width:100%;padding:13px">🔔 Não achou horário? Avise-me quando abrir agenda</button>
</div>

<div class="bar" id="bar"><button class="cta" id="cta" disabled>Escolha local, dia e horário</button></div>

/* ---------- PIX (BR Code estático com valor) ---------- */
const emv = (id, v) => id + String(v.length).padStart(2,'0') + v;
function crc16(s){
  let c = 0xFFFF;
  for(let i=0;i<s.length;i++){
    c ^= s.charCodeAt(i) << 8;
    for(let j=0;j<8;j++) c = (c & 0x8000) ? (((c<<1) ^ 0x1021) & 0xFFFF) : ((c<<1) & 0xFFFF);
  }
  return c.toString(16).toUpperCase().padStart(4,'0');
}
const ascii = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase();
function pixPayload(chave, nome, cidade, valor, txid){
  const mai = emv('00','br.gov.bcb.pix') + emv('01', chave);
  const p = emv('00','01') + emv('26', mai) + emv('52','0000') + emv('53','986') +
            emv('54', Number(valor).toFixed(2)) + emv('58','BR') +
            emv('59', ascii(nome).slice(0,25) || 'RECEBEDOR') + emv('60', ascii(cidade).slice(0,15) || 'BRASIL') +
            emv('62', emv('05', txid)) + '6304';
  return p + crc16(p);
}

function slotsDe(p, d){
  const now = new Date();

async function confirmar(){
  const nome = $('fnome').value.trim(), zap = digits($('fzap').value);
  if(nome.length < 2){ $('ferr').textContent = 'Informe seu nome.'; return; }
  if(zap.length < 10){ $('ferr').textContent = 'Informe um WhatsApp válido com DDD.'; return; }
  const email = $('femail').value.trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ $('ferr').textContent = 'Informe um e-mail válido.'; return; }
  let senha = '';
  if(!SESSION){
    senha = $('fsenha').value;
    if(senha.length < 6){ $('ferr').textContent = 'Crie uma senha de pelo menos 6 caracteres.'; return; }
  }
  const btn = $('fok'); btn.disabled = true; btn.textContent = 'Reservando…'; $('ferr').textContent = '';
  let semSessao = false;
  if(!SESSION){
    const r = await sb.auth.signUp({ email, password:senha, options:{ data:{ nome, whatsapp:zap }, emailRedirectTo: urlVolta() } });
    if(r.error){
      $('ferr').textContent = traduzAuth(r.error.message);
      btn.disabled = false; btn.textContent = 'Reservar e pagar'; return;
    }
    if(r.data.session){ SESSION = r.data.session; } else semSessao = true;
  }
  const { data, error } = await sb.rpc('ta_criar_reserva', {
    p_pro:cur.id, p_data:state.date, p_hora:state.hour, p_local:state.acad, p_nome:nome, p_zap:zap, p_email:email
  });
  if(error || !data || !data[0]){
    $('ferr').textContent = msgErro(error);
    btn.disabled = false; btn.textContent = 'Reservar e pagar';
    if(error && (error.message==='horario_ocupado' || error.message==='fora_da_grade')){
      await carregarOcupados(); state.hour = null; renderDays(); renderSlots(); updateCta();
    }
    return;
  }
  const r = data[0];
  const payload = r.pix_chave
    ? pixPayload(r.pix_chave, r.pix_nome, r.pix_cidade, +r.valor_total, 'TA' + String(r.reserva_id).replace(/-/g,'').slice(0,10).toUpperCase())
    : '';
  const rec = { id:r.reserva_id, proId:cur.id, proNome:cur.nome, mod:cur.mod, date:state.date, hour:state.hour, acad:state.acad,
                total:+r.valor_total, payload, adminZap:r.admin_zap, nome, criada:Date.now() };
  salvarRes(rec);
  if(SESSION) sb.rpc('ta_vincular_reservas', { p_ids:[r.reserva_id] }).then(() => atualizarConta());
  if(semSessao) toast('Conta criada! Confirme seu e-mail para salvar suas conquistas.');
  showPix(rec);
}

      : `<div class="warn">O Pix ainda não foi configurado. Fale com o responsável pelo app.</div>`}
    </div>
    <div class="sub" style="margin-top:14px">Depois de pagar, toque em "Já paguei". Quando o pagamento for confirmado, o contato do profissional aparece aqui.</div>
    <div class="row" style="margin-top:6px"><button class="btn2" id="fechar">Fechar</button><button class="btn1" id="jaPaguei">Já paguei</button></div>
  `);
  if(rec.payload && window.QRCode){
    try{ new QRCode($('qr'), { text: rec.payload, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M }); }catch(e){ $('qr').innerHTML = ''; }
  }
  if(rec.payload) $('copiar').onclick = async () => {
    try{ await navigator.clipboard.writeText(rec.payload); }
    catch(e){ const r = document.createRange(); r.selectNodeContents($('pcode')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    $('copiar').textContent = 'Copiado ✓';
  };
  $('fechar').onclick = async () => { closeSheet(); if(cur){ await carregarOcupados(); state.hour = null; renderDays(); renderSlots(); updateCta(); } renderMinhas(); };
  $('jaPaguei').onclick = () => {
    if(rec.adminZap){
      const msg = `Paguei a aula de ${rec.mod} com ${rec.proNome} (${fmtLong(d)} às ${hh(rec.hour)}) · ${brl2(rec.total)}. Nome: ${rec.nome}.`;

    showAguardando(rec);
  };
  iniciarPoll(rec);
}

const CONQ = [
  { id:'primeira',   ic:'🥋', nome:'Primeira aula',      desc:'Você começou!',          ok:a => a.n >= 1 },
  { id:'semanas',    ic:'🔥', nome:'2 semanas seguidas', desc:'Constância',             ok:a => a.streak >= 2 },
  { id:'madruga',    ic:'🌅', nome:'Madrugador',         desc:'Aula às 7h ou antes',    ok:a => a.madruga },
  { id:'noturno',    ic:'🌙', nome:'Noturno',            desc:'Aula às 20h ou depois',  ok:a => a.noite },
  { id:'explorador', ic:'🧭', nome:'Explorador',         desc:'2 modalidades',          ok:a => a.mods >= 2 },
  { id:'cinco',      ic:'💪', nome:'5 aulas',            desc:'Quinta aula feita',      ok:a => a.n >= 5 },
  { id:'fiel',       ic:'🤝', nome:'Fiel',               desc:'3 aulas com o mesmo pro',ok:a => a.fiel >= 3 },

  { id:'dez',        ic:'🏆', nome:'10 aulas',           desc:'Décima aula feita',      ok:a => a.n >= 10 }
];
const semanaIdx = d => { const [y,m,dd] = d.split('-').map(Number); return Math.floor((Date.UTC(y,m-1,dd)/86400000 + 3) / 7); };
function agregar(l){
  const ws = [...new Set(l.map(x => semanaIdx(x.data)))].sort((a,b) => a-b);
  let best = 0, c = 0, prev = null;
  ws.forEach(w => { c = (prev !== null && w === prev+1) ? c+1 : 1; best = Math.max(best, c); prev = w; });
  const byPro = {}; l.forEach(x => byPro[x.pro_id] = (byPro[x.pro_id] || 0) + 1);
  return { n:l.length, streak:best, madruga:l.some(x => x.hora <= 7), noite:l.some(x => x.hora >= 20),
    mods:new Set(l.map(x => x.modalidade)).size, fiel:Math.max(0, ...Object.values(byPro)),
    fds:l.some(x => { const w = dataObj(x.data).getDay(); return w===0 || w===6; }) };
}
/* real: aulas realizadas em ordem; devolve o que cada aula desbloqueou */
function calcularConquistas(real){
  const desb = {}; let antes = new Set();
  real.forEach((x,i) => {
    const ag = agregar(real.slice(0, i+1));
    const agora = new Set(CONQ.filter(c => c.ok(ag)).map(c => c.id));
    desb[x.id] = { n:i+1, novas:[...agora].filter(id => !antes.has(id)) };
    antes = agora;
  });
  return { desb, todas:antes };
}

/* ---------- imagem para compartilhar ---------- */
function desenharShare(cv, est, img, d){
  const W = 1080, H = 1920, c = cv.getContext('2d'), F = 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  c.clearRect(0,0,W,H); c.shadowColor = 'transparent'; c.shadowBlur = 0;
  if(est !== 'B'){
    if(img){ const k = Math.max(W/img.width, H/img.height), w = img.width*k, h = img.height*k; c.drawImage(img, (W-w)/2, (H-h)/2, w, h); }
    else { const g = c.createLinearGradient(0,0,W,H); g.addColorStop(0,'#2b3340'); g.addColorStop(1,'#0d0f12'); c.fillStyle = g; c.fillRect(0,0,W,H); }
  }
  const card = est === 'C', x = card ? 130 : 90, maxW = card ? 820 : 900;
  let y = card ? H - 800 : H - 720; const y0 = y;
  if(card){ c.fillStyle = '#fff'; c.beginPath(); if(d.fotoImg) c.roundRect(70, y - 270, 940, 975, 48); else c.roundRect(70, y - 70, 940, 740, 48); c.fill(); }
  else if(est === 'A'){ const g = c.createLinearGradient(0, H-1000, 0, H); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.7)'); c.fillStyle = g; c.fillRect(0, H-1000, W, 1000); }
  if(d.fotoImg){
    const im = d.fotoImg, cx = x + 70, cy = y0 - 135, k = Math.max(140/im.width, 140/im.height);
    c.save(); c.beginPath(); c.arc(cx, cy, 70, 0, 7); c.clip(); c.drawImage(im, cx - im.width*k/2, cy - im.height*k/2, im.width*k, im.height*k); c.restore();

let SESSION = null, ISADMIN = false, MYPRO = null;

async function carregarPapeis(){

  if(!session) return;
  const [a, p] = await Promise.all([

  ]);

sb.auth.onAuthStateChange((ev, sess) => {
  SESSION = sess;

const traduzAuth = m => {
  if(/invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if(/email not confirmed/i.test(m)) return 'Confirme seu e-mail antes de entrar (veja a caixa de entrada).';
  if(/already registered|already been registered/i.test(m)) return 'Esse e-mail já tem conta. Use "Entrar".';
  if(/password should be at least/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/rate limit/i.test(m)) return 'Muitas tentativas. Espere alguns minutos.';
  return 'Não foi possível entrar. Tente de novo.';
};
const urlVolta = () => location.protocol.startsWith('http') ? location.origin + location.pathname : undefined;

function authForm(box, onOk){
  box.innerHTML = `

  const cred = () => ({ email: $('au_email').value.trim(), password: $('au_senha').value });

/* ---------- fotos dos profissionais ---------- */
function prepararFoto(file){
  return new Promise((res, rej) => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => {
      const S = 480, c = document.createElement('canvas'); c.width = c.height = S;
      const x = c.getContext('2d'), k = Math.max(S/im.width, S/im.height), w = im.width*k, h = im.height*k;
      x.fillStyle = '#fff'; x.fillRect(0,0,S,S); x.drawImage(im, (S-w)/2, (S-h)/2, w, h);
      URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.85);
    };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); };
    im.src = u;
  });
}
const caminhoFoto = url => { const i = (url || '').indexOf('/ta-fotos/'); return i >= 0 ? decodeURIComponent(url.slice(i + 10)) : null; };
async function enviarFoto(proId, file, antiga){
  const blob = await prepararFoto(file), path = proId + '/' + Date.now() + '.jpg';
  const up = await sb.storage.from('ta-fotos').upload(path, blob, { contentType:'image/jpeg', cacheControl:'31536000' });
  if(up.error) throw up.error;
  const url = sb.storage.from('ta-fotos').getPublicUrl(path).data.publicUrl;
  const { error } = await sb.from('ta_profissionais').update({ foto_url:url }).eq('id', proId);
  if(error) throw error;
  const old = caminhoFoto(antiga); if(old) sb.storage.from('ta-fotos').remove([old]).catch(() => {});
  return url;
}
async function removerFoto(proId, antiga){
  const { error } = await sb.from('ta_profissionais').update({ foto_url:null }).eq('id', proId);
  if(error) throw error;
  const old = caminhoFoto(antiga); if(old) sb.storage.from('ta-fotos').remove([old]).catch(() => {});
}
const escolherArquivo = cb => { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.onchange = () => i.files[0] && cb(i.files[0]); i.click(); };

             : b.conclusao === 'concluida' ? `<span class="badge st-pg">Concluída · você recebe ${brl2(b.valor_aula)}</span>`
             : b.conclusao === 'aluno_faltou' ? `<span class="badge st-rp">Aluno faltou · você recebe ${brl2(b.valor_aula)}</span>`
             : pend ? '<span class="badge st-ag">Falta concluir</span>'

    </div>`;
  }).join('') : '<div class="empty">Nenhuma aula marcada ainda.</div>';

  if(falta) $('blist').insertAdjacentHTML('afterbegin', `<div class="warn" style="margin-bottom:10px">Você tem ${falta} ${falta===1?'aula':'aulas'} para concluir. Ao concluir, o aluno libera a conquista e o seu repasse fica liberado.</div>`);

  $('pdays').querySelectorAll('.day').forEach(b => b.onclick = () => { pdate = key(dias[+b.dataset.i]); renderPanelPro(); });

async function salvarPerfil(){
  const err = m => { $('e_err').style.color = 'var(--danger)'; $('e_err').textContent = m; };
  const nome = $('e_nome').value.trim(), cred = $('e_cred').value.trim(), bio = $('e_bio').value.trim();
  const exp = parseInt($('e_exp').value, 10);
  let zap = digits($('e_zap').value);
  const preco = parseFloat($('e_preco').value.replace(',','.'));
  const fdsRaw = $('e_fds').value.trim(), precoFds = fdsRaw ? parseFloat(fdsRaw.replace(',','.')) : null;
  const locais = $('e_acad').value.split('\n').map(s => s.trim()).filter(Boolean);
  if(nome.length < 2) return err('Informe seu nome.');
  if(!(exp >= 0)) return err('Informe os anos de experiência.');
  if(zap.length < 10) return err('Informe um WhatsApp válido com DDD.');
  if(!(preco > 0)) return err('Informe o valor da aula.');
  if(fdsRaw && !(precoFds > 0)) return err('Valor de fim de semana inválido.');
  if(!locais.length) return err('Informe pelo menos um local.');
  if(zap.length <= 11) zap = '55' + zap;
  const horarios = {};
  $('perfil').querySelectorAll('.hgrid').forEach(g => { horarios[g.dataset.d] = [...g.querySelectorAll('.hb.on')].map(b => +b.dataset.h); });
  const btn = $('e_save'); btn.disabled = true; err('');
  const { data, error } = await sb.from('ta_profissionais').update({
    nome, modalidade:$('e_mod').value, credencial:cred, anos_exp:exp, bio, whatsapp:zap, preco, preco_fds:precoFds, locais, horarios
  }).eq('id', MYPRO.id).select().single();
  btn.disabled = false;
  if(error) return err('Não foi possível salvar: confira os campos.');
  MYPRO = data; renderPanelPro();
  $('e_err').style.color = 'var(--acc)'; $('e_err').textContent = 'Salvo ✓';
}

async function adminAulas(silent){
  if(!silent) $('atab').innerHTML = '<div class="empty">Carregando…</div>';
  const [r, p, c] = await Promise.all([
    sb.from('ta_reservas').select('*').order('data').order('hora'),
    sb.from('ta_profissionais').select('id,nome,modalidade,whatsapp'),
    sb.from('ta_config').select('hold_min').eq('id',1).maybeSingle()
  ]);
  if(!$('atab')) return;
  if(r.error){ $('atab').innerHTML = '<div class="warn">Não foi possível carregar as reservas.</div>'; return; }
  const hold = c.data ? c.data.hold_min : 30;
  const nomes = Object.fromEntries((p.data || []).map(x => [x.id, x]));
  const venceu = b => b.status === 'aguardando' && Date.now() - new Date(b.created_at).getTime() >= hold*60000;
  const devolver = b => b.status === 'cancelada' && b.pago_em && !b.reembolsada;
  const ativa = b => b.status === 'pago' || devolver(b) || (b.status === 'aguardando' && !venceu(b));
  const todas = r.data;
  const pagos = todas.filter(b => b.status === 'pago');
  const recebido = pagos.reduce((s,b) => s + +b.total, 0);
  const prontas = pagos.filter(b => b.conclusao && !b.repasse), esperando = pagos.filter(b => !b.conclusao), aDevolver = todas.filter(devolver);
  const repassar = prontas.reduce((s,b) => s + +b.preco, 0);
  const comissao = pagos.reduce((s,b) => s + +b.taxa, 0);
  const desde = key(new Date(hoje.getTime() - 7*86400000));
  const exp = todas.filter(b => b.data >= desde && (venceu(b) || b.status === 'expirada'));
  const recente = b => b.data >= desde || (b.status === 'pago' && !b.repasse) || devolver(b);
  const lista = todas.filter(b => recente(b) && ativa(b)).concat(mostrarExp ? exp : []);
  $('atab').innerHTML = `
    <div class="kpis">
      <div class="kpi"><b>${brl2(recebido)}</b><span>recebido</span></div>
      <div class="kpi"><b>${brl2(repassar)}</b><span>a repassar (aula concluída)</span></div>
      <div class="kpi"><b>${brl2(comissao)}</b><span>sua comissão</span></div>
    </div>
    <div class="hint" style="margin:-4px 0 12px">Aguardando conclusão: ${esperando.length} ${esperando.length===1?'aula':'aulas'} (${brl2(esperando.reduce((s,b) => s + +b.preco, 0))}) · A devolver ao aluno: ${aDevolver.length} (${brl2(aDevolver.reduce((s,b) => s + +b.total, 0))})</div>
    <div class="btns" style="margin:0 0 12px"><button class="sbtn" id="a_ref">Atualizar</button>
      <button class="sbtn ${mostrarExp?'pri':''}" id="a_exp">${mostrarExp ? 'Ocultar' : 'Mostrar'} expiradas (${exp.length})</button></div>` +
    (lista.length ? lista.map(b => {
      const pr = nomes[b.pro_id], d = dataObj(b.data);
      const expirada = venceu(b) || b.status === 'expirada';
      const st = devolver(b) ? ['st-ag','Devolver Pix ao aluno']
               : b.status === 'pago' ? (b.repasse ? ['st-rp','Repasse feito'] : b.conclusao === 'concluida' ? ['st-pg','Concluída'] : b.conclusao === 'aluno_faltou' ? ['st-pg','Aluno faltou'] : ['st-ag','Pago · aguardando conclusão'])
               : expirada ? ['st-rp','Expirada'] : ['st-ag','Aguardando pagamento'];
      let btns = '';
      if(devolver(b)) btns += `<button class="sbtn pri" data-a="reemb" data-id="${b.id}">Marcar reembolso feito</button>`;
      else if(b.status === 'aguardando') btns += `<button class="sbtn pri" data-a="pago" data-id="${b.id}">Confirmar pagamento</button>`;
      else if(b.status === 'pago' && !b.conclusao) btns += `<button class="sbtn pri" data-a="concluir" data-id="${b.id}">Concluir aula</button><button class="sbtn" data-a="faltou" data-id="${b.id}">Aluno faltou</button>`;
      else if(b.status === 'pago' && !b.repasse) btns += `<button class="sbtn pri" data-a="repasse" data-id="${b.id}">Marcar repasse feito</button>`;
      if(b.status === 'pago' && pr && !b.conclusao){
        btns = `<a class="sbtn ${b.pro_avisado ? '' : 'pri'}" data-a="avisou" data-id="${b.id}" style="text-decoration:none;${b.pro_avisado ? 'color:var(--txt)' : ''}" target="_blank" rel="noopener" href="${wa(pr.whatsapp, msgPro(b, pr))}">${b.pro_avisado ? '📲 Avisar de novo' : '📲 Avisar profissional'}</a>` + btns;
      }
      btns += `<a class="sbtn" style="text-decoration:none;color:var(--txt)" target="_blank" rel="noopener" href="${wa(b.aluno_zap)}">Zap do aluno</a>`;
      if((b.status === 'pago' && !b.conclusao) || b.status === 'aguardando') btns += `<button class="sbtn del" data-a="cancelar" data-id="${b.id}" data-pago="${b.status === 'pago' ? 1 : 0}">Cancelar</button>`;
      return `<div class="bk">
        <div class="bh"><b>${fmtLong(d)} · ${hh(b.hora)}</b><span class="badge ${st[0]}">${st[1]}</span></div>
        <div>${esc(b.aluno_nome)} → ${pr ? esc(pr.nome) : '(profissional removido)'}<br><span style="color:var(--mut)">${esc(b.local)}</span></div>
        <div class="bm">Total ${brl2(b.total)} · repassar ${brl2(b.preco)} · comissão ${brl2(b.taxa)}${b.status === 'pago' && !b.conclusao ? (b.pro_avisado ? ' · profissional avisado ✓' : ' · <b style="color:#ffb86b">profissional ainda não avisado</b>') : ''}</div>
        <div class="btns">${btns}</div>
      </div>`;
    }).join('') : '<div class="empty">Nenhuma aula reservada ainda.</div>');
  $('a_ref').onclick = () => adminAulas();
  $('a_exp').onclick = () => { mostrarExp = !mostrarExp; adminAulas(); };
  $('atab').querySelectorAll('[data-a]').forEach(btn => btn.onclick = async () => {
    const id = btn.dataset.id, a = btn.dataset.a;
    let q;
    if(a === 'pago'){
      const { error: e1 } = await sb.from('ta_reservas').update({ status:'pago' }).eq('id', id);
      if(e1){ toast(msgErro(e1)); return; }
      const b = todas.find(z => z.id === id), pr = b && nomes[b.pro_id];
      if(b) return avisarProSheet(b, pr, () => adminAulas());
      return adminAulas();
    }
    if(a === 'avisou'){ await sb.from('ta_reservas').update({ pro_avisado:true }).eq('id', id); setTimeout(() => adminAulas(), 400); return; }
    else if(a === 'repasse') q = sb.from('ta_reservas').update({ repasse:true }).eq('id', id);
    else if(a === 'concluir') q = sb.from('ta_reservas').update({ conclusao:'concluida' }).eq('id', id);
    else if(a === 'faltou'){ if(!confirm('Marcar que o aluno faltou? O profissional recebe mesmo assim.')) return; q = sb.from('ta_reservas').update({ conclusao:'aluno_faltou' }).eq('id', id); }
    else if(a === 'reemb') q = sb.from('ta_reservas').update({ reembolsada:true }).eq('id', id);
    else { if(!confirm(btn.dataset.pago === '1' ? 'Cancelar essa aula já paga? Você precisará devolver o Pix ao aluno.' : 'Cancelar essa reserva? O horário volta a ficar livre.')) return; q = sb.from('ta_reservas').update({ status:'cancelada' }).eq('id', id); }
    const { error } = await q;
    if(error){ toast(msgErro(error)); return; }
    adminAulas();
  });
}

      <div class="btns"><a class="sbtn" style="text-decoration:none;color:var(--txt)" target="_blank" rel="noopener" href="${wa(a.zap)}">WhatsApp</a></div></div>`).join('') || '<div class="empty">Ainda sem alunos.</div>') +
    `<h2>Quero ser avisado (${i.data.length})</h2>
    <div class="btns" style="margin:0 0 10px"><button class="sbtn" id="cp_in">Copiar lista (planilha)</button></div>` +
    (i.data.map(x => `<div class="bk"><div class="bh"><b>${esc(x.contato)}</b><span class="tag">${esc(x.tipo)}</span></div>
      <div class="bm">${x.modalidade ? esc(x.modalidade) + ' · ' : ''}${esc(x.created_at.slice(0,10))}</div></div>`).join('') || '<div class="empty">Ninguém na lista ainda.</div>');
  const cp = (id, t) => $(id).onclick = async () => { try{ await navigator.clipboard.writeText(t); toast('Copiado. Cole numa planilha.'); }catch(e){ toast('Não consegui copiar neste navegador.'); } };
  cp('cp_al', csvAl); cp('cp_in', csvIn);
}

async function adminCfg(){
  $('atab').innerHTML = '<div class="empty">Carregando…</div>';
  const { data:c, error } = await sb.from('ta_config').select('*').eq('id', 1).maybeSingle();
  if(error || !c){ $('atab').innerHTML = '<div class="warn">Não foi possível carregar a configuração.</div>'; return; }
  $('atab').innerHTML = `
    <h2 style="margin-top:14px">Comissão</h2>
    <label>Porcentagem sobre o valor da aula (%)</label><input id="c_pct" inputmode="decimal" value="${c.comissao_pct}">
    <label>Valor mínimo por aula (R$)</label><input id="c_min" inputmode="decimal" value="${c.comissao_min}">
    <div class="hint" id="c_ex" style="margin-top:8px"></div>
    <h2>Recebimento por Pix</h2>
    <label>Chave Pix (prefira uma chave aleatória)</label><input id="c_chave" value="${esc(c.pix_chave)}" placeholder="sua chave Pix">
    <label>Nome do recebedor (como aparece no banco)</label><input id="c_nome" value="${esc(c.pix_nome)}">
    <label>Cidade</label><input id="c_cidade" value="${esc(c.pix_cidade)}">
    <label>Seu WhatsApp para o aluno avisar "já paguei" (com DDD)</label><input id="c_zap" inputmode="tel" value="${esc(c.admin_zap.replace(/^55/,''))}">
    <label>Minutos que o horário fica segurado aguardando o Pix</label><input id="c_hold" inputmode="numeric" value="${c.hold_min}">
    <div class="err" id="c_err"></div>
    <div class="row"><button class="btn1" id="c_save">Salvar</button></div>`;
  const ex = () => {
    const pct = parseFloat($('c_pct').value.replace(',','.')), mn = parseFloat($('c_min').value.replace(',','.'));
    if(!(pct>=0) || !(mn>=0)){ $('c_ex').textContent = ''; return; }
    $('c_ex').innerHTML = [45,60,80,100].map(v => { const t = r2(Math.max(v*pct/100, mn)); return `Aula ${brl(v)} → taxa ${brl2(t)} → aluno paga ${brl2(v+t)}`; }).join('<br>');
  };
  $('c_pct').oninput = ex; $('c_min').oninput = ex; ex();
  $('c_save').onclick = async () => {
    const err = m => { $('c_err').style.color = 'var(--danger)'; $('c_err').textContent = m; };
    const pct = parseFloat($('c_pct').value.replace(',','.')), mn = parseFloat($('c_min').value.replace(',','.')), hold = parseInt($('c_hold').value, 10);
    let zap = digits($('c_zap').value);
    if(!(pct>=0 && pct<=50)) return err('Porcentagem entre 0 e 50.');
    if(!(mn>=0)) return err('Mínimo inválido.');
    if(!(hold>=5 && hold<=240)) return err('O prazo do Pix fica entre 5 e 240 minutos.');
    if(zap && zap.length <= 11) zap = '55' + zap;
    const { error } = await sb.from('ta_config').update({
      comissao_pct:pct, comissao_min:mn, hold_min:hold, pix_chave:$('c_chave').value.trim(),
      pix_nome:$('c_nome').value.trim(), pix_cidade:$('c_cidade').value.trim(), admin_zap:zap
    }).eq('id', 1);
    if(error) return err(msgErro(error));
    $('c_err').style.color = 'var(--acc)'; $('c_err').textContent = 'Salvo ✓';
  };
}

/* ---------- instalar na tela inicial ---------- */
const UA = navigator.userAgent;
const ehIOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const ehMobile = ehIOS || /Android/i.test(UA);
const instalado = () => window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
const emAppSocial = /Instagram|FBAN|FBAV|WhatsApp|TikTok|Snapchat|Line\//i.test(UA);
let pedidoInstalar = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedidoInstalar = e; });
window.addEventListener('appinstalled', () => { pedidoInstalar = null; store.set('ta_inst_ok', 1); renderInstalar(); });
const ISVG = {
  bolt:'<svg width="30" height="30" viewBox="0 0 1024 1024"><path d="M560 120 L260 560 L470 560 L400 900 L760 420 L540 420 Z" fill="#11140a" stroke="#11140a" stroke-width="30" stroke-linejoin="round"/></svg>',
  share:'<svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  plus:'<svg width="14" height="14" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
};
function renderInstalar(){
  const box = $('instcard'), btn = $('openInst'); if(!box) return;
  const ok = ehMobile && !instalado() && !store.get('ta_inst_ok', 0);
  btn.style.display = ok ? '' : 'none';
  const visitas = store.get('ta_visitas', 0), dism = store.get('ta_inst_dism', 0);
  const mostrar = ok && (visitas >= 2 || store.get(RES_KEY, []).length) && (!dism || Date.now() - dism > 14*86400000);
  if(!mostrar){ box.innerHTML = ''; return; }
  box.innerHTML = `<div class="inst"><button class="x" id="instX" aria-label="Dispensar"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><div class="ic">${ISVG.bolt}</div>
    <div class="tx"><b>Instale o app</b><span>Fica na tela inicial, sem baixar nada</span></div><button class="go" id="instGo">Ver como</button></div>`;
  $('instGo').onclick = () => abrirInstalar();
  $('instX').onclick = () => { store.set('ta_inst_dism', Date.now()); renderInstalar(); };
}
function abrirInstalar(aba){
  aba = aba || (ehIOS ? 'ios' : 'and');
  const ios = aba === 'ios';
  openSheet(`<h3>Instalar o Treino Now</h3><div class="sub">Em 30 segundos o app fica na sua tela inicial, como qualquer outro.</div>
    <div class="itabs"><button data-t="ios" class="${ios?'on':''}">iPhone</button><button data-t="and" class="${ios?'':'on'}">Android</button></div>
    ${ios ? `
    <div class="iwarn">⚠️ ${emAppSocial ? '<b>Você está dentro de outro app.</b> ' : ''}No iPhone, só dá para instalar pelo <b>Safari</b>. Se abriu pelo Instagram ou WhatsApp, toque em <b>⋯</b> e escolha <b>Abrir no Safari</b> antes de começar.</div>
    <div class="ist"><div class="n">1</div><div style="flex:1"><b>Toque em Compartilhar</b><span class="d">O ícone do quadrado com a seta, na barra de baixo do Safari.</span>
      <div class="ill"><div class="safbar"><span>‹</span><span>›</span><span class="hl">${ISVG.share}</span><span>▢</span><span>⧉</span></div></div></div></div>
    <div class="ist"><div class="n">2</div><div style="flex:1"><b>"Adicionar à Tela de Início"</b><span class="d">Role a lista para baixo até achar essa opção.</span>
      <div class="ill"><div class="imenu"><div>Copiar <span>⧉</span></div><div>Adicionar aos Favoritos <span>★</span></div><div class="hl">Adicionar à Tela de Início <span>${ISVG.plus}</span></div><div>Imprimir <span>⎙</span></div></div></div></div></div>
    <div class="ist"><div class="n">3</div><div style="flex:1"><b>Toque em Adicionar</b><span class="d">Pronto: o ícone do raio aparece na tela inicial.</span></div></div>
    <div class="row"><button class="btn1" id="inst_ok">Entendi</button></div>`
    : `
    <div class="ist"><div class="n">1</div><div style="flex:1"><b>Toque nos três pontos ⋮</b><span class="d">No canto de cima do Chrome.</span></div></div>
    <div class="ist"><div class="n">2</div><div style="flex:1"><b>"Instalar app" ou "Adicionar à tela inicial"</b><span class="d">Confirme em Instalar. O ícone aparece na tela inicial.</span>
      <div class="ill"><div class="imenu"><div>Nova guia <span>＋</span></div><div class="hl">Instalar app <span>⬇</span></div><div>Compartilhar <span>↗</span></div></div></div></div></div>
    <div class="row">${pedidoInstalar ? '<button class="btn1" id="inst_now">Instalar agora</button>' : '<button class="btn1" id="inst_ok">Entendi</button>'}</div>
    ${pedidoInstalar ? '<div class="hint" style="margin-top:8px;text-align:center">Seu navegador liberou a instalação direta.</div>' : ''}`}`);
  $('sheet').querySelectorAll('.itabs button').forEach(b => b.onclick = () => abrirInstalar(b.dataset.t));
  if($('inst_ok')) $('inst_ok').onclick = closeSheet;
  if($('inst_now')) $('inst_now').onclick = async () => { const p = pedidoInstalar; pedidoInstalar = null; closeSheet(); try{ p.prompt(); await p.userChoice; }catch(e){} renderInstalar(); };
}
$('openInst').onclick = () => abrirInstalar();
(function(){ try{ if(!sessionStorage.getItem('ta_vis_s')){ sessionStorage.setItem('ta_vis_s','1'); store.set('ta_visitas', store.get('ta_visitas', 0) + 1); } }catch(e){} })();
