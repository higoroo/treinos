/* ---------- puxar para atualizar ---------- */
var PTR={y0:0,ativo:false,puxando:false,altura:0};
function ptrEls(){return {box:document.getElementById('ptr'),ring:document.getElementById('ptrRing'),
  msg:document.getElementById('ptrMsg')}}
function ptrPode(){
  // so na raiz das telas principais, nunca no treino nem com ficha aberta
  if(document.getElementById('sheet'))return false;
  if(view==='sessao'||view==='landing'||view==='auth'||view==='onboard'||view==='novasenha')return false;
  return (window.scrollY||document.documentElement.scrollTop||0)<=0;
}
function ptrMostra(d){
  var e=ptrEls();if(!e.ring)return;
  var p=Math.min(1,d/90);
  e.ring.style.opacity=p;
  e.ring.style.transform='translateY('+Math.min(d*.55,54)+'px) rotate('+Math.round(d*2.6)+'deg)';
}
function ptrLimpa(){
  var e=ptrEls();if(!e.ring)return;
  e.box.classList.remove('gira');
  e.ring.style.transition='opacity .25s,transform .25s';
  e.ring.style.opacity='0';e.ring.style.transform='translateY(0) rotate(0deg)';
  setTimeout(function(){if(e.ring)e.ring.style.transition=''},260);
  e.msg.classList.remove('on');
}
function ptrAviso(txt){
  var e=ptrEls();if(!e.msg)return;
  e.msg.textContent=txt;e.msg.classList.add('on');
  setTimeout(function(){if(e.msg)e.msg.classList.remove('on')},1600);
}
async function ptrSolta(){
  var e=ptrEls();
  if(!SB.user){ptrLimpa();ptrAviso('entre para sincronizar');return}
  if(!navigator.onLine){ptrLimpa();ptrAviso('sem conexão');return}
  e.box.classList.add('gira');
  e.ring.style.opacity='1';
  e.ring.style.transform='translateY(42px)';
  var t0=Date.now();
  try{await sincronizar(true)}catch(x){}
  var falta=620-(Date.now()-t0);          // gira pelo menos meio segundo, senao pisca
  setTimeout(function(){
    ptrLimpa();
    if(SB.msg)ptrAviso('não deu para sincronizar');
    render();
  },Math.max(0,falta));
}
function ligarPTR(){
  document.addEventListener('touchstart',function(ev){
    if(!ptrPode()||PTR.ativo)return;
    PTR.y0=ev.touches[0].clientY;PTR.puxando=true;PTR.altura=0;
  },{passive:true});
  document.addEventListener('touchmove',function(ev){
    if(!PTR.puxando||PTR.ativo)return;
    var d=ev.touches[0].clientY-PTR.y0;
    if(d<=0){PTR.altura=0;ptrMostra(0);return}
    if(!ptrPode()){PTR.puxando=false;ptrMostra(0);return}
    PTR.altura=d;ptrMostra(d);
  },{passive:true});
  document.addEventListener('touchend',function(){
    if(!PTR.puxando)return;
    PTR.puxando=false;
    if(PTR.altura>=80&&!PTR.ativo){PTR.ativo=true;ptrSolta().then(function(){PTR.ativo=false})}
    else ptrLimpa();
    PTR.altura=0;
  },{passive:true});
}

/* ---------- boot ---------- */
function temDados(d){
  if(!d)return false;
  return !!((d.sessoes&&d.sessoes.length)||(d.treinos&&d.treinos.length)||
            (d.series&&d.series.length)||(d.perfil&&d.perfil.nome));
}
async function convitePendente(){
  var c='';
  try{c=sessionStorage.getItem('treinos:convite')||''}catch(e){}
  if(!c||!SB.user)return;
  try{sessionStorage.removeItem('treinos:convite')}catch(e){}
  await socCarregar(true);
  if(!SOC.perfil){
    var nome=(db.perfil&&db.perfil.nome)||'';
    if(nome)await socCriarPerfil(nome);
  }
  var g=await socEntrarGrupo(c);
  if(g){view='amigos';ctx={};render();
    setTimeout(function(){alert('Você entrou em '+g.nome+'.')},350);}
}
async function aposLogin(){
  try{if(SB.user)localStorage.setItem('treinos:uid',SB.user.id)}catch(e){}
  db=await store.get();
  if(!temDados(db)){
    // primeiro login neste aparelho: adota o que ja existia, sem perder nada
    var legado=await store.get(KEY_LEGADO);
    if(temDados(legado)){
      try{if(!localStorage.getItem('treinos:backup'))
        localStorage.setItem('treinos:backup',JSON.stringify(legado))}catch(e){}
      db=legado;
    }else if(!db)db=vazio();
  }
  migrar();
  await salvar();
  checarConquistas(true);
  // so pedimos a nuvem quando o aparelho nao tem nada
  var vazioLocal=!temDados(db);
  if(vazioLocal){
    await sincronizar(true);
    checarConquistas(true);
    if(!temDados(db)){view='onboard';ctx={passo:1,tmp:{}}}else view='home';
    render();avisoFuso();convitePendente();return;
  }
  // já temos tudo no aparelho: abre na hora e sincroniza por trás
  view='home';render();avisoFuso();
  sincronizar(true).then(function(){checarConquistas(true);render();avisoFuso()});
  convitePendente();
}
/* o conserto de data nao pode acontecer calado: a pessoa precisa saber
   que o historico dela mudou, e que da pra voltar atras */
function avisoFuso(){
  if(!DATAS_CORRIGIDAS)return;
  var n=DATAS_CORRIGIDAS;DATAS_CORRIGIDAS=0;
  setTimeout(function(){
    flash(n===1?'1 data corrigida':n+' datas corrigidas');
  },700);
}
function migrar(){
  if(!db.perfil)db.perfil={nome:'',meta:4,descanso:90,principal:'musculacao'};
  if(!db.perfil.principal)db.perfil.principal='musculacao';
  ['whatsapp','academia','nascimento','peso'].forEach(function(c){if(db.perfil[c]==null)db.perfil[c]=''});
  if(!db.objetivos)db.objetivos=[];
  if(!db.campeonatos)db.campeonatos=[];
  if(db.calExp===undefined)db.calExp=false;
  if(!db.tecnicas)db.tecnicas=[];
  if(!db.graduacoes||!db.graduacoes.length)db.graduacoes=[{id:uid(),faixa:'Branca',grau:0,data:hoje(),professor:'',academia:''}];
  (db.treinos||[]).forEach(function(t){(t.itens||[]).forEach(function(i){if(!i.id)i.id=uid()})});
  repararFuso();
}

/* Conserto de uma vez: antes, treino comecado depois das 21h ficava com a
   data do dia seguinte, porque o dia saia em UTC. O 'inicio' e um instante
   e nunca esteve errado, entao ele diz qual era o dia de verdade.
   Treino lancado para outro dia nao e tocado: ali a data veio da pessoa e
   o inicio foi montado a partir dela, entao os dois ja batem. */
var DATAS_CORRIGIDAS=0, FUSO_MEXEU=[];
function repararFuso(){
  if(!db||!db.sessoes||!db.sessoes.length)return 0;
  var erradas=[];
  db.sessoes.forEach(function(s){
    if(!s.inicio||!s.data)return;
    var t=new Date(s.inicio);
    if(isNaN(t))return;
    var real=dISO(t);
    if(real!==s.data)erradas.push({s:s,para:real});
  });
  if(!erradas.length)return 0;
  // guarda como estava antes de encostar em qualquer coisa
  try{localStorage.setItem('treinos:backup:fuso',JSON.stringify(db))}catch(e){}
  erradas.forEach(function(e){
    e.s.data=e.para;
    if(FUSO_MEXEU.indexOf(e.s.id)<0)FUSO_MEXEU.push(e.s.id);
  });
  DATAS_CORRIGIDAS+=erradas.length;
  return erradas.length;
}
(async function(){
  db=vazio();
  var recuperando=/type=recovery/.test(location.hash||'')||/type=recovery/.test(location.search||'');
  var mConv=/[?&]g=([A-Za-z0-9]+)/.exec(location.search||'');
  if(mConv){try{sessionStorage.setItem('treinos:convite',mConv[1])}catch(e){}
    history.replaceState(null,'',location.pathname);}
  try{await window.SB_PRONTO}catch(e){}      // só decide a tela depois que a biblioteca chegou
  await iniciarSB();
  if(recuperando){view='novasenha';render();return}
  if(SB.user){await aposLogin();return}
  // quem ja usa este aparelho entra direto, com ou sem conta, com ou sem internet
  var u=uidLocal();
  var local=u?await store.get('treinos:db:'+u):null;
  if(!temDados(local))local=await store.get(KEY_LEGADO);   // uso anterior sem login
  if(temDados(local)){
    db=local;migrar();checarConquistas(true);view='home';render();
    // quando a rede voltar, o app se reconecta sozinho
    var tentar=async function(){
      if(!navigator.onLine)return;
      if(await iniciarSB()&&SB.user){render();sincronizar(true)}
    };
    setTimeout(tentar,3000);
    window.addEventListener('online',tentar);
    return;
  }
  view='landing';render();
})();
